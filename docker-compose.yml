services:
  orchestrator-api:
    build: .
    container_name: dgx-orchestrator-api
    restart: unless-stopped
    init: true          # <-- reaps orphaned children (SSH ControlPersist
                         #     masters especially) so they can't accumulate
                         #     as zombies over a multi-day uptime -- see
                         #     run_ssh()'s docstring in common/ssh.py
    ports:
      - "5001:5001"
    environment:
      - BASE_DIR=/app
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh
      - ~/.cache/huggingface:/root/.cache/huggingface:ro

  dashboard-ui:
    image: nginx:alpine
    container_name: dgx-dashboard-ui
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - orchestrator-api
