<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetrel Security | DGX Spark Control Plane</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box;
        }
        
        /* Header */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .clock { font-family: monospace; font-size: 13px; background: var(--bg-card); padding: 6px 12px; border-radius: 6px; border: 1px solid #475569; }
        .net-badge { font-size: 12px; padding: 4px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-block; transition: all 0.2s ease; border: 1px solid transparent; }
        .net-badge:hover { filter: brightness(1.2); }

        /* Top Layout: Hosts + Deployer */
        .dashboard-top {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            flex-shrink: 0;
        }
        .hosts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Cards */
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
        }
        .card h2 { margin: 0 0 10px 0; font-size: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Badges & Metrics */
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .badge.online, .badge.ready { background: #065f46; color: #34d399; }
        .badge.offline { background: #7f1d1d; color: #f87171; }
        .badge.loading { background: #78350f; color: #fbbf24; }
        .badge.none { background: #334155; color: var(--text-muted); }
        
        .metric-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 13px; color: #cbd5e1; }
        .metric-val { font-family: monospace; color: var(--accent); font-size: 12px; text-align: right; }
        .telemetry-ticker { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--border-color); font-size: 11px; color: var(--text-muted); text-align: center; font-family: monospace; }

        /* Forms & Inputs */
        label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 500; }
        select, input { 
            background: var(--bg-dark); 
            color: white; 
            border: 1px solid #475569; 
            padding: 10px; 
            border-radius: 6px; 
            width: 100%; 
            margin-bottom: 12px; 
            box-sizing: border-box; 
            font-size: 14px; /* Prevents iOS Zoom */
            min-height: 44px; /* Touch target size */
        }
        
        /* Buttons */
        .btn { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            transition: background 0.2s; 
            width: 100%; 
            min-height: 44px;
        }
        .btn:hover:not(:disabled) { background: #0369a1; }
        .btn:disabled { background: #475569; color: var(--text-muted); cursor: not-allowed; }
        .btn-danger { background: #dc2626; margin-top: 8px; }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; }

        /* Logs Section (Flex-Grow to fill bottom) */
        .log-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-top: 15px;
            min-height: 0; /* Critical for flex scrolling */
        }
        .log-card { margin: 0; flex-grow: 1; padding: 15px; }
        .log-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; }
        .log-header-row h2 { margin: 0; border: none; padding: 0; }
        .log-header-row select { width: auto; min-height: 32px; padding: 4px 10px; margin: 0; font-size: 12px; }
        
        pre#logBox { 
            background: var(--bg-dark); 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 12px; 
            color: #cbd5e1; 
            flex-grow: 1; 
            margin: 0; 
            overflow-y: auto; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
        }

        /* Mobile & Tablet Responsiveness */
        @media (max-width: 1024px) {
            body { height: auto; min-height: 100vh; overflow-y: auto; }
            .dashboard-top { grid-template-columns: 1fr; }
            .log-section { height: 50vh; min-height: 400px; flex-grow: 0; }
        }
        @media (max-width: 650px) {
            .hosts-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; align-items: flex-start; }
            .clock { align-self: flex-start; margin-top: 5px; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Tetrel Security | DGX Spark Control Plane
            </h1>
            <div id="netBadge" class="net-badge" style="margin-top: 6px;" onclick="toggleNetworkMode()">Checking Network...</div>
        </div>
        <div class="clock" id="serverClock">Connecting...</div>
    </header>

    <div class="dashboard-top">
        <div class="hosts-grid" id="hostsGrid">
            <!-- Dynamic Host Cards injected via JS -->
        </div>

        <div class="card">
            <h2>Model Deployer</h2>
            
            <label>Select Model:</label>
            <select id="modelSelect" onchange="updateTopologyOptions()"></select>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Topology:</label>
                    <select id="nodesSelect" onchange="updateHeadNodeVisibility()">
                        <!-- Populated Dynamically -->
                    </select>
                </div>
                <div id="headSelectContainer">
                    <label>Target (1-Node):</label>
                    <select id="headSelect">
                        <option value="spark-4">spark-4 (9dbe)</option>
                        <option value="spark-3">spark-3 (6e63)</option>
                    </select>
                </div>
            </div>
            
            <label>User ID / Auditor:</label>
            <input type="text" id="userIdInput" value="dashboard_user">
            
            <div style="margin-top: auto;">
                <button id="deployBtn" class="btn" onclick="triggerDeploy()">Deploy Model</button>
                <button id="teardownBtn" class="btn btn-danger" onclick="triggerTeardown()">Teardown Runtimes</button>
            </div>
        </div>
    </div>

    <div class="log-section">
        <div class="card log-card">
            <div class="log-header-row">
                <h2>Live Logs (<span id="logHostLabel">spark-4</span>)</h2>
                <select id="logHostSelect" onchange="updateLogHost()">
                    <option value="spark-4">spark-4 Node</option>
                    <option value="spark-3">spark-3 Node</option>
                </select>
            </div>
            <pre id="logBox">Loading logs...</pre>
        </div>
    </div>

<script>
    const API_PORT = 5001;
    const API_BASE = `http://${window.location.hostname}:${API_PORT}/api`;
    let currentLogHost = 'spark-4';
    let currentOfflineState = false;
    let globalCatalog = {};

    async function fetchStatus() {
        try {
            const res = await fetch(`${API_BASE}/status`);
            const data = await res.json();
            document.getElementById('serverClock').innerText = `Server Time: ${data.server_time}`;
            
            const netBadge = document.getElementById('netBadge');
            if (data.network_mode === "Working in OFFLINE mode") {
                currentOfflineState = true;
                netBadge.innerHTML = '🔒 OFFLINE MODE';
                netBadge.style.color = '#f87171';
                netBadge.style.borderColor = '#991b1b';
                netBadge.style.background = '#450a0a';
            } else {
                currentOfflineState = false;
                netBadge.innerHTML = '🌐 ONLINE MODE';
                netBadge.style.color = '#34d399';
                netBadge.style.borderColor = '#065f46';
                netBadge.style.background = '#022c22';
            }

            const grid = document.getElementById('hostsGrid');
            grid.innerHTML = '';
            
            for (const [host, info] of Object.entries(data.hosts)) {
                const nodeStatus = info.docker_status || info.status || 'OFFLINE';
                const statusBadge = nodeStatus === 'ONLINE' ? '<span class="badge online">ONLINE</span>' : '<span class="badge offline">OFFLINE</span>';
                
                let modelBadgeClass = 'none';
                const modelStatusStr = info.model_status || 'NONE';
                if (modelStatusStr === 'READY') {
                    modelBadgeClass = 'ready';
                } else if (modelStatusStr.startsWith('NOT READY')) {
                    modelBadgeClass = 'loading';
                }
                const modelBadge = `<span class="badge ${modelBadgeClass}">${modelStatusStr}</span>`;

                const containerName = info.container_name || info.container || 'None';
                const containerState = info.container_state ? `(${info.container_state})` : '';
                const runtimeDisplay = containerName !== 'None' ? `${containerName} ${containerState}` : 'None';

                let telemetryHtml = '';
                if (info.telemetry && info.telemetry.gpu_temp_c !== undefined) {
                    telemetryHtml = `🌡️ ${info.telemetry.gpu_temp_c}°C &nbsp;|&nbsp; ⚡ ${info.telemetry.gpu_util_pct}% &nbsp;|&nbsp; 💾 ${info.telemetry.mem_used_mb}/${info.telemetry.mem_total_mb} MB`;
                } else {
                    telemetryHtml = `Telemetry Unavailable`;
                }

                grid.innerHTML += `
                    <div class="card">
                        <h3 style="margin: 0 0 10px 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                            ${host} ${statusBadge}
                        </h3>
                        <div class="metric-row"><span>Docker Daemon:</span><span class="metric-val">${nodeStatus}</span></div>
                        <div class="metric-row"><span>Container:</span><span class="metric-val">${runtimeDisplay}</span></div>
                        <div class="metric-row"><span>Loaded Model:</span><span class="metric-val">${info.active_model || 'None'}</span></div>
                        <div class="metric-row"><span>Model Status:</span><span class="metric-val">${modelBadge}</span></div>
                        <div class="metric-row"><span>ETA:</span><span class="metric-val">${info.eta_display || 'N/A'}</span></div>
                        <div class="telemetry-ticker">${telemetryHtml}</div>
                    </div>
                `;
            }
        } catch (e) {
            document.getElementById('serverClock').innerText = 'API Connection Lost';
            const netBadge = document.getElementById('netBadge');
            netBadge.innerText = '⚠️ API Disconnected';
            netBadge.style.color = '#fbbf24';
            netBadge.style.background = '#451a03';
            netBadge.style.borderColor = '#78350f';
        }
    }

    async function toggleNetworkMode() {
        const nextState = !currentOfflineState;
        const targetModeStr = nextState ? "Working in OFFLINE mode" : "Working in ONLINE mode";
        if(!confirm(`Switch cluster network state to: "${targetModeStr}"?`)) return;

        try {
            await fetch(`${API_BASE}/toggle-network`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ offline: nextState })
            });
            fetchStatus();
        } catch(e) {
            alert('Failed to toggle network mode.');
        }
    }

    async function fetchCatalog() {
        try {
            const res = await fetch(`${API_BASE}/catalog`);
            const data = await res.json();
            globalCatalog = data.catalog.models || {};
            
            const select = document.getElementById('modelSelect');
            select.innerHTML = '';
            for (const modelKey of Object.keys(globalCatalog)) {
                select.innerHTML += `<option value="${modelKey}">${modelKey}</option>`;
            }
            updateTopologyOptions();
        } catch (e) {
            console.error('Failed to load catalog');
        }
    }

    function updateTopologyOptions() {
        const model = document.getElementById('modelSelect').value;
        const nodesSelect = document.getElementById('nodesSelect');
        const topologies = globalCatalog[model]?.topologies || {};
        
        nodesSelect.innerHTML = '';
        if (topologies['1_node']) {
            nodesSelect.innerHTML += `<option value="1">1 Node</option>`;
        }
        if (topologies['2_node']) {
            nodesSelect.innerHTML += `<option value="2">2 Node</option>`;
        }
        updateHeadNodeVisibility();
    }

    function updateHeadNodeVisibility() {
        const nodes = document.getElementById('nodesSelect').value;
        const headContainer = document.getElementById('headSelectContainer');
        if (nodes === "2") {
            headContainer.style.visibility = 'hidden';
        } else {
            headContainer.style.visibility = 'visible';
        }
    }

    async function fetchLogs() {
        try {
            const res = await fetch(`${API_BASE}/logs/${currentLogHost}?tail=150`);
            const data = await res.json();
            const logBox = document.getElementById('logBox');
            
            // Detect if the user is currently looking at the bottom of the logs
            const isScrolledToBottom = logBox.scrollHeight - logBox.clientHeight <= logBox.scrollTop + 20;
            
            logBox.innerText = data.logs.join('\n');
            
            // Snap back to the bottom only if they were already there
            if (isScrolledToBottom) {
                logBox.scrollTop = logBox.scrollHeight;
            }
        } catch (e) {
            document.getElementById('logBox').innerText = 'Failed to fetch logs.';
        }
    }

    function updateLogHost() {
        currentLogHost = document.getElementById('logHostSelect').value;
        document.getElementById('logHostLabel').innerText = currentLogHost;
        fetchLogs();
    }

    async function triggerDeploy() {
        const model = document.getElementById('modelSelect').value;
        const nodes = parseInt(document.getElementById('nodesSelect').value);
        const head = document.getElementById('headSelect').value;
        const user_id = document.getElementById('userIdInput').value;

        if(!confirm(`Deploy ${model} on ${nodes} node(s)?`)) return;

        const btn = document.getElementById('deployBtn');
        const origText = btn.innerText;
        btn.innerText = 'Deploying...';
        btn.disabled = true;

        try {
            const response = await fetch(`${API_BASE}/deploy`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({model, nodes, head, user_id})
            });
            
            if (!response.ok) {
                const errData = await response.json();
                alert(`Deployment Error: ${errData.detail || response.statusText}`);
            } else {
                alert('Deployment sequence initiated successfully!');
            }
        } catch(e) {
            alert('Deployment request failed.');
        } finally {
            btn.innerText = origText;
            btn.disabled = false;
        }
    }

    async function triggerTeardown() {
        if(!confirm('Are you sure you want to teardown all active runtimes across the cluster?')) return;
        
        const btn = document.getElementById('teardownBtn');
        const origText = btn.innerText;
        btn.innerText = 'Tearing down...';
        btn.disabled = true;

        try {
            await fetch(`${API_BASE}/teardown`, {method: 'POST'});
            alert('Teardown sequence initiated.');
        } catch(e) {
            alert('Teardown request failed.');
        } finally {
            btn.innerText = origText;
            btn.disabled = false;
        }
    }

    fetchCatalog();
    fetchStatus();
    fetchLogs();
    setInterval(fetchStatus, 4000);
    setInterval(fetchLogs, 5000);
</script>
</body>
</html>
