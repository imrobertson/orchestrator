rules:

  - id: E001
    summary: "No nvfp4-family --kv-cache-dtype on an MLA-architecture model."
    confidence: known_bad
    enforce: error
    scope: {engine: vllm, architecture: mla}
    condition:
      all:
        - {field: vllm_args, flag: "--kv-cache-dtype", value_matches: "^nvfp4"}
        - {field: hf_path, matches: "(?i)deepseek-v[234]|mla"}
    failure: "pydantic_core.ValidationError: nvfp4 KV cache is not supported with MLA (Multi-head Latent Attention) backends"
    fails_at: config_creation      # before any weight load or GPU cost
    remedy: "Use --kv-cache-dtype fp8 or auto."
    evidence:
      tombstones: [56]
      incidents: [3]
      notes: >-
        vLLM core guard, landed with upstream PR #40177. Not image-specific.
        The validated fp8-on-MLA example is now
        deepseek-v4-flash-0731-dspark.yaml / -512k.yaml / -1M.yaml; earlier
        docs cite deepseek-v4-flash-0731-nvfp4.yaml, which was deleted in the
        2026-08-29 catalog trim.

  - id: E002
    summary: "Do not pass --quantization modelopt_fp4 together with an explicit --kv-cache-dtype."
    confidence: known_bad
    enforce: error
    scope: {image_family: eugr}
    condition:
      all:
        - {field: vllm_args, flag: "--quantization", value: "modelopt_fp4"}
        - {field: vllm_args, flag_present: "--kv-cache-dtype"}
    failure: "Container entrypoint hook silently overrides the explicit dtype back to nvfp4_ds_mla, re-triggering E001 even when the author correctly wrote fp8."
    remedy: "Omit --quantization modelopt_fp4; let vLLM auto-detect from config.json, and keep --kv-cache-dtype fp8 explicit."
    evidence: {incidents: [3], notes: "This is the actual pattern in the working DeepSeek V4 Flash 0731 recipe."}

  - id: E003
    summary: "Every 2-node topology must carry --distributed-executor-backend ray explicitly."
    confidence: known_bad
    enforce: error
    scope: {topology: multi_host}
    condition:
      all:
        - {field: topology.nodes, gt: 1}
        - {field: vllm_args, flag_absent: "--distributed-executor-backend"}
    failure: "AssertionError: collective_rpc should not be called on follower node -- the mp backend relies on /dev/shm, which cannot cross physical hosts."
    remedy: "Add --distributed-executor-backend ray. There is no safe default: use_ray requires the literal tokens present, and their absence silently routes onto the --nnodes/--headless path rather than failing closed."
    evidence:
      tombstones: [43]
      incidents: [1]
      notes: >-
        Reproduced independently 2026-08-31 (Task MD) on a from-scratch
        Qwen3-0.6B TP=2 recipe with vllm_args: '' -- an ABSENT flag is
        enough, it does not require a deliberately wrong one.
        LIVE VIOLATIONS as of 2026-09-09: qwen-3.8-27b::2_node and
        qwen-3.8-27b-nvfp4-sqk2::2_node both omitted this flag. Fixed in
        the same pass; recorded here because an error-grade rule with live
        violations and no linter is the case for building the linter
        (WORKSTREAMS.md WS-3).
        NOTE the distinct second failure this string also names: TOMBSTONES
        #140 produces the identical `collective_rpc` error from a different
        cause (module entrypoint parsing and ignoring --headless), fixed by
        launch_argv_prefix, NOT by this flag. Same message, two rules.

  - id: E004
    summary: "A 2-node recipe must use an image that actually ships the ray binary."
    confidence: known_bad
    enforce: error
    scope: {topology: multi_host}
    condition:
      all:
        - {field: topology.nodes, gt: 1}
        - {field: image, ships_ray: false}
    failure: "/opt/nvidia/nvidia_entrypoint.sh: line 55: exec: ray: not found -- before any Python starts."
    remedy: "Switch image to eugr/spark-vllm-b12x:latest (confirmed to ship Ray), or bake Ray in via the mods pipeline."
    evidence:
      tombstones: [103]
      incidents: [11]
      notes: >-
        Distinct failure from E003, not a rediscovery of it. Having the flag
        right is not enough if the image cannot run it. Confirmed fixed live
        on llama-3.3-70b, llama-4-fp4, llama-4-fp8.
        A recipe with NO `image:` field at all inherits default_image
        (ngc_default, ships_ray: false) and therefore trips this rule --
        the omission is the violation. LIVE VIOLATION as of 2026-09-09:
        qwen-3.8-27b had no image: field and a 2_node topology, the FOURTH
        recurrence of this trap after #103 fixed three recipes and
        nemotron-3_5-lightning-bf16's header describes adding image:
        proactively "rather than let it recur a third time."

  - id: E005
    summary: "MTP-family speculative decoding cannot be combined with pp_size > 1."
    confidence: known_bad
    enforce: error
    scope: {engine: vllm}
    condition:
      all:
        - {field: vllm_args, flag: "--speculative-config", json_key: method, value_matches: "mtp"}
        - {field: topology.pp_size, gt: 1}
    failure: "NotImplementedError: Pipeline parallelism is not supported for this model. Supported models implement the SupportsPP interface."
    fails_at: config_creation
    remedy: "Use tp_size (or a single node). The MTP draft-model class does not implement SupportsPP, independent of whether the target model does."
    evidence:
      tombstones: [104, 107]
      incidents: [13]
      notes: >-
        Confirmed live on qwen-3.6-27b-nvfp4::2_node 2026-09-03. Applied to
        qwen-3.5-122b by mechanism (model-agnostic), not independently
        reproduced.
        LIVE VIOLATIONS as of 2026-09-09: qwen-3.8-27b::2_node and
        qwen-3.8-27b-nvfp4-sqk2::2_node, both pp_size 2 with
        qwen3_next_mtp. Missed by #107's sweep, which rebuilt the
        qwen-3.5-122b siblings as TP. Both fixed in the same pass. Note the
        failure is CHEAP -- config_creation, before any weight load -- which
        is why two dead recipes sat in the catalog unnoticed. Cheap failures
        need a linter precisely because they never produce an incident
        anyone remembers.

  - id: E006
    summary: "DSpark requires num_speculative_tokens >= 5."
    confidence: known_bad
    enforce: error
    scope: {engine: vllm, method: dspark}
    condition:
      all:
        - {field: vllm_args, flag: "--speculative-config", json_key: method, value: dspark}
        - {field: vllm_args, flag: "--speculative-config", json_key: num_speculative_tokens, lt: 5}
    failure: "pydantic_core.ValidationError: DSpark requires num_speculative_tokens >= dspark_block_size (5)"
    remedy: "Keep num_speculative_tokens at 5 or above; fit the VRAM budget with --max-num-seqs or a shorter context instead."
    evidence: {tombstones: [61]}

  - id: E007
    summary: "DSpark speculative decoding must use tensor parallelism, never pipeline stages."
    confidence: known_bad
    enforce: error
    scope: {engine: vllm, method: dspark, topology: multi_host}
    condition:
      all:
        - {field: vllm_args, flag: "--speculative-config", json_key: method, value: dspark}
        - {field: topology.pp_size, gt: 1}
    failure: "Speculative state evaluation breaks across pipeline stages."
    remedy: "tp_size: 2, pp_size: 1."
    evidence: {notes: "TROUBLESHOOTING.md, Speculative Decoding / MTP (DSpark) Constraints."}

  - id: E008
    summary: "Gemma 4 requires --attention-backend TRITON_ATTN."
    confidence: validated
    enforce: warn
    scope: {model_family: gemma-4, image_family: eugr}
    condition:
      all:
        - {field: hf_path, matches: "(?i)gemma-4"}
        - {field: vllm_args, flag_not_value: {flag: "--attention-backend", value: "TRITON_ATTN"}}
    remedy: "Gemma 4 has heterogeneous head dimensions (256 local / 512 global) the default FlashInfer path does not handle correctly."
    evidence:
      notes: >-
        Validated 2026-08-29 TP=2, 12.0 tok/s decode, matching independent
        community TP=2 figures (~11.2). Confirmed via 'Using
        AttentionBackendEnum.TRITON_ATTN backend.' 3x across the cluster --
        resolved, not merely requested.
        SCOPE NOTE added 2026-09-09: this rule is scoped image_family: eugr
        and must stay there. gemma4-26b-a4b-aeon-dflash runs
        ghcr.io/aeon-7/aeon-vllm-ultimate without this flag and is validated
        at 49-103 tok/s across prompt categories, so widening the scope
        would make the rule fire on a known-good recipe -- rule 3.

  - id: E009
    summary: "Gemma 4 uses the BF16 base checkpoint with --quantization fp8, never a pre-quantized -FP8 repo."
    confidence: known_bad
    enforce: warn
    scope: {model_family: gemma-4}
    condition:
      all:
        - {field: hf_path, matches: "(?i)gemma-4.*fp8"}
    failure: "google/gemma-4-31B-it-FP8 does not exist (401 RepositoryNotFoundError). A real third-party FP8 repo fails differently: KeyError 'layers.0.mlp.down_proj.weight_scale' in gemma4.py load_weights (vLLM #38912)."
    remedy: "hf_path: google/gemma-4-31B-it plus --quantization fp8. Opposite of the DeepSeek pattern."
    evidence: {incidents: [10]}

  - id: E010
    summary: "Do not use eugr/spark-vllm-b12x for MTP speculative decoding on Gemma 4."
    confidence: known_bad
    enforce: error
    scope: {model_family: gemma-4, image: "eugr/spark-vllm-b12x:latest"}
    condition:
      all:
        - {field: hf_path, matches: "(?i)gemma-4"}
        - {field: image, equals: "eugr/spark-vllm-b12x:latest"}
        - {field: vllm_args, flag_present: "--speculative-config"}
    failure: "TypeError: Gemma4Proposer._greedy_sample() takes 2 positional arguments but 3 were given -- on the first real generation request, NOT during warmup, so /health passing gives false confidence."
    remedy: "Use eugr/spark-vllm:latest (mainline). Confirmed working across 8 live runs, ~50-53 tok/s single-stream."
    evidence:
      tombstones: [89]
      notes: >-
        Specific to the MTP proposer path. -b12x's MoE-kernel speedup remains
        worth keeping for workloads that do not need MTP. A SECOND
        independent reason to fall back from b12x to mainline exists and is
        NOT this rule: qwen-3.6-35b-a3b-nvfp4-nothink pins mainline to avoid
        a B12x plugin NVML crash, which is not MTP-specific and not Gemma-4-
        specific. Do not merge the two; they have different conditions.

  - id: E011
    summary: "vllm_args must be written as a YAML block scalar (>-), never a quoted flow scalar."
    confidence: known_bad
    enforce: error
    scope: {applies_to: recipe_syntax}
    condition:
      any:
        - {field: vllm_args, raw_style: double_quoted}
        - {field: vllm_args, contains_comment: true}
    failure: >-
      A double-quoted scalar terminates at the first embedded " inside a JSON
      --speculative-config, surfacing as 'Model ... not defined in catalog'
      with nothing pointing at YAML. A folded scalar containing a # comment
      flattens into the arg string and reaches argparse as a literal token.
    remedy: "Use >-. Keep all operational notes outside the scalar."
    evidence: {tombstones: [28, 42, 88], incidents: [4]}

  - id: E012
    summary: "Do not mount a broad host directory at /root/.cache when a subpath is also separately mounted."
    confidence: known_bad
    enforce: none          # not expressible from a recipe; documentation only
    scope: {applies_to: docker_run_construction}
    failure: "Docker resolves the overlap by path specificity, so it 'works' until heavy concurrent mmap (exactly what loading safetensors does) hits through the parent mount. Real, reproducible corruption risk."
    remedy: "Mount each JIT cache root explicitly and separately (triton, tilelang, deepgemm, vllm, flashinfer), with the HuggingFace mount entirely outside that tree. This is what _jit_cache_mounts_and_env() does."
    evidence: {notes: "Replicate this shape when hand-rolling a docker run outside the orchestrator."}

  - id: E013
    summary: "A chat-template mod requires a matching --chat-template flag in vllm_args."
    confidence: unconfirmed
    enforce: warn
    scope: {applies_to: mods}
    condition:
      all:
        - {field: mods, any_matches: "chat-template"}
        - {field: vllm_args, flag_absent: "--chat-template"}
    remedy: "The mod and the flag are correct only together; nothing else enforces the pairing."
    evidence: {notes: "Derived from eugr's mod library, not from a local incident. Warn only."}

  - id: E014
    summary: "Recipe env_vars should not carry VLLM_* variables this build ignores."
    confidence: validated   # validated against builds.original_pin ONLY -- see caveat below
    enforce: warn
    scope: {build: "v0.1.dev20003+gad848fc41.d20260815"}
    needs_reverification: >-
      :latest has since moved to builds.latest_confirmed
      (v0.1.dev20482+g83cb22a0e.d20260903, confirmed 2026-09-03). This rule's
      scope is deliberately left pinned to the OLD build rather than
      silently widened -- these five env vars have not been re-checked
      against the new one, and this is exactly the kind of build-specific
      claim that VLLM_USE_V1 (E015) turned out to be wrong about. As
      written, this rule now goes DORMANT for any recipe reporting the new
      build string, which is the correct conservative behavior but means it
      currently protects nothing live. Re-run the same boot-log check
      ('Unknown vLLM environment variable detected') against
      builds.latest_confirmed before widening scope or adding a second,
      new-build-scoped copy of this rule.
    condition:
      all:
        - {field: env_vars, key_in: [VLLM_CPU_OMP_THREADS, VLLM_ENGINE_INITIALIZATION_TIMEOUT, VLLM_RPC_TIMEOUT, VLLM_NVFP4_GEMM_BACKEND, VLLM_USE_FLASHINFER_MOE_FP4]}
    remedy: >-
      Confirmed inert on this build via 'WARNING [envs.py:2477] Unknown vLLM
      environment variable detected'. Remove opportunistically when the recipe
      is being re-validated anyway -- NOT as a catalog-wide sweep, since every
      env_vars change alters compute_config_hash() and resets that recipe's
      launch-success history.
    not_actionable:
      - key: VLLM_BASE_DIR
        reason: "Image-level ENV on eugr bases (docker inspect .Config.Env). Present in every container from that base; no recipe change can remove it. A checker that flags it fires forever and trains people to ignore the warning."
      - key: OMP_NUM_THREADS
        reason: "A real OpenMP variable, not a vLLM one. Stays."
    evidence: {notes: "Confirmed 2026-08-29/30 on gemma-4-31b, then again on minimax-m2_7-nvfp4-gb10 and nemotron-3-nano-30b-a3b-nvfp4 -- pattern holds across four recipes. Community-sourced recipes are a recurring source."}

  - id: E015
    summary: "VLLM_USE_V1=0 no longer exists in vLLM on the current build -- historically required, now dead weight. RESOLVED 2026-09-03."
    confidence: known_bad   # known-bad TO INCLUDE, on builds.latest_confirmed specifically -- see scope
    enforce: warn
    scope: {build: "v0.1.dev20482+g83cb22a0e.d20260903"}   # = builds.latest_confirmed, deliberately pinned not aliased -- see builds: block header
    condition:
      all:
        - {field: env_vars, key_in: [VLLM_USE_V1]}
    status: resolved_on_latest_confirmed_build   # was: contested. See `positions` for the full history -- kept, not deleted.
    positions:
      - claim: "Required alongside --distributed-executor-backend ray for 2-node cross-host topologies."
        source: "TROUBLESHOOTING.md Incident #1 / TOMBSTONES #43 (V4.8.1). Written from a real observed failure, on builds.original_pin."
      - claim: "Has no observable effect."
        source: "gemma-4-31b 2-node, 2026-08-29, on builds.original_pin. Set, and the engine still logged 'Initializing a V1 LLM engine'."
      - claim: "Not needed at all."
        source: "deepseek-v4-flash-0731-dspark::2_node, 2026-09-02, on builds.original_pin. Never set; ran with distributed_executor_backend: 'ray' and completed ready with real phase data."
      - claim: "REMOVED FROM vLLM ENTIRELY -- decisive."
        source: >-
          Direct inspection of eugr/spark-vllm-b12x:latest,
          builds.latest_confirmed (v0.1.dev20482+g83cb22a0e.d20260903),
          2026-09-03. `vllm.envs` raises AttributeError: module 'vllm.envs'
          has no attribute 'VLLM_USE_V1'. The whole `vllm.executor` package
          (the V0 executor, including ray_distributed_executor) is absent --
          ModuleNotFoundError. There is no V0 Ray executor left for the
          variable to select. `vllm.engine.llm_engine` still resolves, but
          as a compatibility shim over V1, not a V0 path.
    resolution: >-
      INERT on builds.latest_confirmed, and worse than inert: since vLLM no
      longer defines the name, any recipe still carrying VLLM_USE_V1=0 now
      trips the "Unknown vLLM environment variable detected" warning (same
      mechanism as E014's category, though not literally E014's list -- E014
      is still scoped to the OLD build, see its own needs_reverification
      note) and contributes dead config to compute_config_hash(). Incident
      #1's rule is hereby SCOPED to builds.original_pin, not deleted -- it
      came from a real observed failure there, and the Ray-flag half of it
      (E003) remains fully load-bearing and build-independent. Only the
      VLLM_USE_V1 half is dead, and only confirmed dead on
      builds.latest_confirmed specifically -- this rule's `scope.build`
      reflects exactly that boundary rather than a general "always" claim.
      TOMBSTONES.md #113 records this as a finding, independent of this
      file.
    remedy: >-
      Strip VLLM_USE_V1=0 opportunistically as each recipe is re-validated,
      never as a catalog-wide sweep: every env_vars change alters
      compute_config_hash() and resets that recipe's launch-success history.
      As of 2026-09-09 five recipes still carry it -- llama-4-fp4,
      llama-4-fp8, llama-4-fp8-tp, qwen-2_5-coder-32b,
      _llama-4-fp8-tp-noep. That count is recorded so it is known, NOT as a
      task: WORKSTREAMS.md F-j records two config_hash orphaning bumps
      already, and a sweep would be a third.
    evidence: {tombstones: [43, 103, 113], incidents: [1]}

  - id: E016
    summary: "--attention-backend B12X_ATTN is known-bad with DeepSeek-V4 sparse MLA plus speculative draft tokens."
    confidence: known_bad
    enforce: warn
    scope: {model_family: deepseek-v4, hardware: sm120}
    condition:
      all:
        - {field: vllm_args, flag: "--attention-backend", value: "B12X_ATTN"}
        - {field: vllm_args, flag_present: "--speculative-config"}
    failure: "FlashInfer's JIT autotuner (sparse_mla_sm120_decode_dsv4) cannot match non-standard draft tensor shapes (7, 32, 512) to pre-compiled tuning buckets during _dummy_run -- startup timeout or fallback to unoptimized runners."
    remedy: "--attention-backend FLASH_ATTN for speculative builds."
    evidence: {tombstones: [62]}

  - id: E017
    summary: "--moe-backend flashinfer_b12x is UNCONFIRMED, not known-good."
    confidence: unconfirmed
    enforce: none
    scope: {hardware: gb10}
    remedy: >-
      Only ever present in a recipe that also carried E001's known-bad
      kv-cache-dtype, and that deploy crashed during config validation before
      MoE execution was reached. Nothing confirms it works or that it is
      broken. --moe-backend flashinfer_cutlass is the validated choice on the
      eugr images -- see E025, which now carries the SwiGLU mechanism this
      rule used to reach for by citation.
    evidence:
      errata: [E025]
      notes: >-
        Evidence pointer rewritten 2026-09-09. This rule previously cited
        `incidents: [2]`, meaning TROUBLESHOOTING.md's incident log, which
        was archived that day. The mechanism it was reaching for is now in
        E025 rather than in a retired file.

  - id: E025
    summary: "DeepSeek-V4 on a eugr image needs --moe-backend flashinfer_cutlass for GB10's SwiGLU clamping."
    confidence: validated
    enforce: warn
    scope: {model_family: deepseek-v4, hardware: gb10, image_family: eugr}
    condition:
      all:
        - {field: hf_path, matches: "(?i)deepseek-v4"}
        - {field: image, family: eugr}
        - {field: vllm_args, flag_not_value: {flag: "--moe-backend", value: "flashinfer_cutlass"}}
    failure: >-
      ValueError during initialization naming swiglu_limit=10.0, or a
      complaint about missing MoE backends. DeepSeek-V4 enforces SwiGLU
      clamping at 10.0; the flashinfer_b12x kernels do not apply that clamp
      on GB10 silicon.
    remedy: >-
      Pass --moe-backend flashinfer_cutlass explicitly. When speculative
      decoding is also in use, set "moe_backend":"flashinfer_cutlass" INSIDE
      the --speculative-config JSON as well -- the outer flag does not reach
      the draft path.
    scope_caution: >-
      IMAGE-SCOPED, and the scope is doing real work. The hazyumps GB10-native
      image (hazyumps/deepseek-v4-flash-gb10) needs NO --moe-backend flag at
      all: it auto-selects FlashInfer SM120 sparse-MLA decode plus MARLIN MoE
      correctly, which is why the validated DSpark recipes deliberately omit
      the flag. Widening this rule past image_family: eugr would fire on the
      cluster's best-performing recipe -- linter rule 3.
    evidence:
      notes: >-
        Rescued 2026-09-09 from TROUBLESHOOTING.md Incident #2 during that
        file's dissolution. Validated on real hardware; it is the pattern
        every working eugr-image DeepSeek recipe used. Written as a rule here
        rather than left as prose because E017 already depended on it by
        citation and would have been left pointing at an archived file.

  - id: E018
    summary: "Two catalog keys sharing an identical hf_path must be flagged, not silently resolved."
    confidence: known_bad
    enforce: warn
    scope: {applies_to: catalog}     # cross-recipe, not per-recipe
    condition:
      all:
        - {check: duplicate_field_across_recipes, field: hf_path}
    failure: >-
      _resolve_catalog_key() matches on
      `hf_path.endswith(loaded_model) or cat_key == loaded_model or
      loaded_model in hf_path` and returns the FIRST match. When two catalog
      entries serve the same checkpoint, dict iteration order silently
      decides which key the telemetry and dashboard attribute to -- splitting
      real usage data across two ledger entries with nothing surfaced.
    confirmed_instance: >-
      nemotron-3.5-lightning-bf16.yaml and nemotron-3_5-lightning-bf16.yaml,
      both live, both hf_path nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16.
      Split lifetime tokens onto the dot key while launch_history/runs went to
      the underscore key. TOMBSTONES #110. RESOLVED 2026-09-03: dot-form
      recipe deleted by operator; only one hf_path owner remains. Orphaned
      ledger keys from the deleted file are a separate, still-open cleanup --
      see WORKSTREAMS.md WS-4 -- not a live instance of this rule anymore.
    remedy: >-
      Warn, never auto-resolve. Legitimate same-hf_path pairs exist by design
      (TP vs PP siblings, context-size variants, speculative-depth sweeps), so
      this cannot be an error -- but an UNINTENTIONAL pair is invisible today.
      Separately, make _resolve_catalog_key() detect multiple matches rather
      than returning the first.
    known_intentional:
      # Verified against every file in recipes/local/ on 2026-09-09. The
      # first four were recorded earlier; the last five were live and
      # undeclared, so this rule would have fired on all of them as
      # unexplained. Keeping this list complete is what stops rule 3's
      # "a warning that always fires is a warning nobody reads".
      - "qwen-2_5-coder-32b / -tp (PP vs TP comparison pair)"
      - "qwen-3.5-122b-tp / -mtp2 / -mtp4 (speculative depth sweep)"
      - "deepseek-v4-flash-0731-dspark / -512k / -1M (context-size variants)"
      - "llama-4-fp8 / -tp (PP vs TP comparison pair, WORKSTREAMS.md WS-1)"
      - "llama-4-fp8 / -tp / _llama-4-fp8-tp-noep (the _-prefixed third is the expert-parallel-disabled experiment)"
      - "qwen-3.8-27b-nvfp4 / -sqk2 (unsloth/Qwen3.8-27B-NVFP4; see the note on -sqk2's 2_node below)"
      - "qwen-3.6-35b-a3b-nvfp4 / -nothink (thinking-mode-disabled variant, kept because thinking scored 0/5 on the coding suite)"
      - "gemma4-26b-a4b-nvfp4 / -tools (tool-calling variant on mainline rather than -b12x, per E010)"
      - "muse-glimmer-30b-nvfp4 / -dflash-tools (DFlash drafter + tool-calling variant)"
    evidence: {tombstones: [57, 77, 110, 111]}   # 111 = the resolution entry

  - id: E019
    summary: "model_path_override's container-side basename must equal hf_path's basename, case included."
    confidence: known_bad
    enforce: warn
    scope: {applies_to: recipe}
    condition:
      all:
        - {field: model_path_override, present: true}
        - {check: basename_mismatch, field_a: model_path_override, field_b: hf_path, case_sensitive: true}
    failure: >-
      _discover_host_container() derives loaded_model by splitting the
      --model value on "/" and taking the last element. _resolve_catalog_key()
      then matches that case-sensitively against hf_path and cat_key. A
      basename mismatch fails all three of its match conditions, so it
      returns loaded_model unchanged -- a string that is not a catalog key.
      Per that function's own docstring it is the single source of truth for
      anything keying a ledger, session tracker, or historical lookup, so
      the fallback keys them on a fabricated name. Same class as the
      fabricated ::2_node keys in TOMBSTONES #127, reached by a different
      door.
    confirmed_instance: >-
      glm-5_3-flash-nvfp4-mtp as first written (then named
      _glm-5.3-flash-nvfp4-tp2), 2026-09-07: model_path_override
      /models/glm-5.3-flash-nvfp4 against hf_path
      RedHatAI/GLM-5.3-Flash-NVFP4. Simulated against the real matcher --
      match False before case-matching, True after. Caught in code review
      before the recipe deployed, so no ledger data was corrupted; the
      mechanism is confirmed by source read, the trigger by a real recipe
      that was about to ship.
    remedy: >-
      Rename the CONTAINER side of the extra_mounts entry, and
      model_path_override with it, to match hf_path's basename exactly
      including case. The host side is unconstrained. Do NOT fix this by
      making _resolve_catalog_key() case-insensitive -- broadening a fuzzy
      matcher with a history of ambiguous collisions (E018, tombstones
      57/77/110) trades a narrow avoidable problem for a wider one.
    mitigating_factor: >-
      _resolve_active_recipe() prefers ACTIVE_DEPLOYMENT_STATE's exact
      record, which covers every orchestrator-initiated deploy, so this is
      degraded-fallback rather than live breakage. It bites when that record
      is absent: cleared state, a container outliving it, anything started
      outside the deploy path. Warn rather than error for that reason.
    evidence:
      tombstones: [133]
      notes: >-
        Statically checkable -- two string comparisons on the recipe YAML.
        No registry access, no docker inspect. Safe in the load_recipes()
        soft-warning path. Asserted independently in verify_glm_recipe.py.

  - id: E020
    summary: 'An image that sets its own ENTRYPOINT needs entrypoint "" in the recipe.'
    confidence: known_bad
    enforce: none              # NOT load-path enforceable -- see notes
    scope: {applies_to: recipe}
    condition:
      all:
        - {field: image, entrypoint_non_empty: true}
        - {field: entrypoint, present: false}
    failure: >-
      docker APPENDS a container CMD to an image's ENTRYPOINT rather than
      replacing it. The orchestrator builds its argv as a CMD, so an image
      with a non-empty ENTRYPOINT receives that argv as arguments to
      something else. On a 2-node ray deploy the container CMD
      ["ray","start","--head","--port=6379","--num-gpus=1","--block"] became
      `vllm serve ray start ... --block`, and vLLM's argparse prefix-matched
      --block to --block-size (unambiguous -- no other flag starts that way)
      and died demanding a value. The error names --block-size, a flag the
      recipe DOES set, for a token it does not: "vllm serve: error: argument
      --block-size: expected one argument". Reading it cold points straight
      at the wrong line.
    confirmed_instance: >-
      glm-5_3-flash-nvfp4-mtp (then _glm-5.3-flash-nvfp4-tp2) on
      ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v8 (ENTRYPOINT
      ["vllm","serve"]), 2026-09-07. Earlier and unrecorded at the time:
      ghcr.io/aeon-7/aeon-vllm-ultimate (ENTRYPOINT bash), which is why
      deploy_gemma4_dflash.py existed as a repo-root standalone rather than
      a recipe.
    candidate_instance: >-
      muse-glimmer-30b.yaml on vllm/vllm-openai:nightly, found 2026-09-09 by
      reading the catalog rather than by a failed deploy. That image is now
      in the images: block with entrypoint: ["vllm","serve"], so an audit
      script can resolve this statically. NOT reproduced on hardware --
      suspected, not confirmed. Promote to a confirmed_instance only after a
      real deploy fails, per rule 4.
    remedy: >-
      Set entrypoint: "" in the recipe. The quotes are load-bearing -- a bare
      `entrypoint:` parses as null, which is identical to omitting the field.
      See E022.
    evidence:
      tombstones: [133]
      notes: >-
        enforce is `none` deliberately and should stay there until an
        offline consumer exists. Testing Config.Entrypoint needs `docker
        inspect`, which needs the image pulled or registry access, and
        build_catalog_response() fails closed -- one exception in the load
        path empties the whole catalog (TOMBSTONES #41, linter rule 1). This
        rule is written for an on-demand tools/audit_recipe_images.py pass
        (WORKSTREAMS.md WS-3), not for load_recipes(). The images: block now
        records `entrypoint:` for all THREE known-affected images, so an
        audit script can resolve this statically for images it already
        knows. Promote to `warn` only once that path exists and is what
        consumes it.

  - id: E021
    summary: "model_path_override must resolve inside a path some extra_mounts entry provides."
    confidence: mechanism_confirmed
    enforce: warn
    scope: {applies_to: recipe}
    condition:
      all:
        - {field: model_path_override, present: true}
        - {check: not_prefixed_by_any, field: model_path_override, source: extra_mounts, side: container}
    failure: >-
      _execute_deployment_impl() mounts exactly two things: the per-host
      volume_mount from cluster_config.yaml (the shared HF cache) and
      whatever extra_mounts provides. A model_path_override outside both is
      simply not present in the container, and the deploy fails at model
      load -- minutes in, with an ENOENT naming a file rather than the
      missing mount, which sends diagnosis at the file instead of at the
      recipe.
    remedy: "Add the mount, or correct the path so it falls under an existing container-side mount point."
    evidence:
      tombstones: [133]
      notes: >-
        MECHANISM_CONFIRMED, not known_bad: derived by reading the mount
        construction in _execute_deployment_impl(), not from an incident.
        The trigger has not been observed. The CONSEQUENCE has -- an
        ENOENT inside the container for a path that should have been
        provided is exactly what TOMBSTONES #133 layer 3 produced by a
        different route, so the cost of the failure is known even though
        this particular cause has not fired. Fires only on an actual
        mismatch, never on a correct recipe. Promote to known_bad the
        first time it catches something real.

  - id: E022
    summary: 'An `entrypoint:` key present but null is almost certainly a missing pair of quotes.'
    confidence: mechanism_confirmed
    enforce: warn
    scope: {applies_to: recipe}
    condition:
      all:
        - {check: key_present_but_null, field: entrypoint, source: raw_yaml}
    failure: >-
      `entrypoint: ""` (quoted empty string) neutralizes the image's own
      ENTRYPOINT. A bare `entrypoint:` parses as null, which is IDENTICAL to
      omitting the field -- no --entrypoint flag is passed at all. The two
      differ by two characters and produce opposite behaviour, and the
      failure is E020's: an argv silently handed to the image's entrypoint
      as arguments, surfacing as an error about an unrelated flag.
    remedy: 'Write entrypoint: "" if neutralization was intended, or delete the key entirely if it was not. Do not leave it null.'
    evidence:
      tombstones: [133]
      notes: >-
        MECHANISM_CONFIRMED, not known_bad: the None-vs-"" distinction is
        confirmed load-bearing throughout the entrypoint implementation --
        every test is `is not None`, never truthiness, precisely because a
        truthiness check collapses "neutralize" into "do nothing". A null in
        the YAML reintroduces that collapse one layer above where any Python
        discipline can catch it. Nobody has typed it yet. Fires only on an
        actual null, never on a correct recipe.
        IMPLEMENTATION CONSTRAINT: must be checked against the RAW YAML
        (`"entrypoint" in doc and doc["entrypoint"] is None`), not against a
        parsed RecipeConfig -- pydantic erases the distinction, which is the
        whole reason this rule can exist at all.

  - id: E023
    summary: "Never pass --speculative-model as a separate flag; the drafter belongs in --speculative-config's model key."
    confidence: known_bad
    enforce: error
    scope: {engine: vllm}
    condition:
      all:
        - {field: vllm_args, flag_present: "--speculative-model"}
    failure: >-
      These builds reject a standalone --speculative-model flag. The
      speculative drafter is a member of the --speculative-config JSON
      object, not a sibling argument, and passing both is not additive --
      the recipe crashes at startup.
    fails_at: config_creation
    remedy: >-
      Move the repo id into --speculative-config's `model` key and delete the
      separate flag:
      --speculative-config '{"method":"dspark","model":"<repo>","num_speculative_tokens":5}'
    evidence:
      tombstones: [143]
      notes: >-
        Added 2026-09-09. The diagnosis already existed in the repo and had
        never reached this file: _deepseek-v4-flash-vision-exp.yaml's header
        states "This build REJECTS a separate `--speculative-model` flag
        (confirmed: our nemotron-3.5 recipe crashed on exactly that)." The
        crash was observed, understood, written down in a DIFFERENT recipe,
        and the broken recipe was never fixed.
        LIVE VIOLATIONS as of 2026-09-09: nemotron-3.5-lightning-nvfp4 and
        _nemotron-3.5-lightning-nvfp4-tools, both fixed in the same pass.
        This rule is the clearest single argument for the linter in
        WORKSTREAMS.md WS-3 -- the knowledge existed, in this repository,
        and did not reach the file that needed it. Distinct from E006/E007,
        which constrain DSpark's parameters rather than how a drafter is
        declared at all.

  - id: E024
    summary: "--moe-backend marlin is NVFP4-only and is rejected on a mixed FP8/NVFP4 checkpoint."
    confidence: known_bad
    enforce: warn              # see notes -- not decidable from the recipe alone
    scope: {engine: vllm, hardware: gb10}
    condition:
      all:
        - {field: vllm_args, flag: "--moe-backend", value: "marlin"}
        - {field: hf_path, in: checkpoints_known_mixed_precision}
    failure: >-
      ValueError: moe_backend='marlin' is not supported for unquantized MoE.
      The marlin MoE kernel path requires uniformly NVFP4-quantized expert
      weights; a checkpoint that quantizes only some expert groups presents
      the rest as unquantized and the resolver refuses the whole config.
    fails_at: config_creation
    remedy: >-
      Omit --moe-backend entirely and let vLLM auto-select. The mixed layout
      is a property of the checkpoint, not something a flag can reconcile.
    checkpoints_known_mixed_precision:
      - repo: "unsloth/Qwen3.6-35B-A3B-NVFP4"
        layout: >-
          group_0 FP8 for attention, linear_attn and lm_head plus the MoE
          experts on layers 32-39; group_1 NVFP4 for MoE gate/up/down on all
          layers. Read from the checkpoint's own quantization config.
    evidence:
      tombstones: [143]
      notes: >-
        Added 2026-09-09 from qwen-3.6-35b-a3b-nvfp4.yaml's header, which
        records this as the cause of BOTH 2026-09-05 load failures.
        enforce is `warn`, not `error`, for one reason: whether a checkpoint
        is mixed-precision is NOT decidable from the recipe YAML. It
        requires reading the checkpoint's quantization config, which needs
        network or a local snapshot -- the same constraint that keeps E020
        at `none`. The condition above therefore leans on a curated
        checkpoints_known_mixed_precision list, which is honest about being
        incomplete rather than pretending to a general predicate. A recipe
        setting marlin against a checkpoint NOT on that list is not cleared
        by this rule; it is simply unchecked. Widen the list when a new
        mixed checkpoint is found, and consider folding the real check into
        tools/audit_recipe_images.py, which already needs registry access
        for E020.


# 1. NEVER hard-fail the catalog. build_catalog_response() fails closed on any
#    single bad recipe, so one linter exception would empty the entire model
#    list with nothing surfaced to the dashboard user (TOMBSTONES #41).
#    Report; do not raise out of load_recipes().
# 2. `enforce: none` rules are documentation. The linter reads them so a human
#    can query them; it must not emit a finding for them.
# 3. A rule scoped to a build or image must not fire outside that scope. The
#    VLLM_BASE_DIR case is the cautionary example: a warning that always fires
#    is a warning nobody reads, and it hides the ones that matter. E018's
#    known_intentional list is the same principle applied to a cross-recipe
#    rule -- an incomplete list makes the rule noise.
# 4. New rules come from real incidents only, with ONE bounded exception --
#    the `mechanism_confirmed` tier, see rule 6. Every rule needs an
#    `evidence` block; a rule nobody can trace back to either a failure or a
#    read of the code that causes one is a guess with a version number.
# 6. `mechanism_confirmed` is not a loophole in rule 4. It exists because
#    some consequences are deterministic from code that was actually read --
#    a path that is not mounted is not in the container; a YAML null is not
#    an empty string -- and calling those `unconfirmed` ("never exercised")
#    understates them while forcing enforce: none, whereas calling them
#    `known_bad` ("watched it fail") is simply false. To qualify, a rule
#    must clear THREE bars, all of them:
#      (a) the mechanism is confirmed by direct source read, and the
#          evidence block names what was read;
#      (b) it fires ONLY on an actual mismatch, never on a correct recipe --
#          rule 3's "a warning that always fires is a warning nobody reads"
#          applies with full force, and a heuristic cannot clear this;
#      (c) the CONSEQUENCE has been observed somewhere, even though this
#          particular TRIGGER has not. A rule that can point at neither an
#          observed trigger nor an observed consequence is `unconfirmed`,
#          enforce: none, like everything else that has never been
#          exercised.
#    Promote to `known_bad` the first time such a rule catches something
#    real, and say so in its evidence block. A mechanism_confirmed rule that
#    has never fired after a long time is worth re-examining: it may be
#    guarding something that cannot actually happen.
# 5. A `scope: {build: ...}` pin is a snapshot, not a guarantee -- :latest
#    floats, confirmed real 2026-09-03 when the build moved three weeks
#    between two sessions and made E015's contested history resolvable
#    outright. A build-scoped rule does not fire incorrectly when the tag
#    moves past it; it goes silently DORMANT, which is worse. Do not widen
#    a rule's scope to "assume it still holds" without re-checking -- see
#    E014's needs_reverification field for the pattern to follow: leave the
#    old scope in place, name the gap explicitly, don't guess.
# 7. A rule with LIVE VIOLATIONS in the catalog is evidence about the
#    LINTER, not only about the rule. Added 2026-09-09, when a source-read
#    pass found four recipes violating E003, E004 and E005 -- all three
#    `enforce: error`, all three written from real incidents, all silently
#    unenforced because nothing reads this file yet. Record violations in
#    the rule's evidence block when they are found, so the cost of the
#    missing linter stays visible rather than being fixed quietly.
