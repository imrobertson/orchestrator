# errata.yaml -- machine-readable recipe rules.
#
# Source of truth for the recipe linter AND for the human-readable tuning
# reference (render the doc from this file; do not maintain both by hand --
# that divergence is what TROUBLESHOOTING.md's tuning section became).
#
# Every rule carries its own evidence. A rule with confidence: unconfirmed
# is present so nobody re-derives it, NOT so the linter can act on it --
# see `enforce`.
#
# FIELDS
#   id            stable identifier; never reused, never renumbered
#   summary       one line, imperative where possible
#   confidence    validated   -- watched it work
#                 known_bad   -- watched it fail, mechanism understood
#                 unconfirmed -- written down, never actually exercised
#   enforce       error | warn | none
#                 `none` = documentation only; the linter must not fire
#   scope         what the rule is bounded by. A rule verified on exactly
#                 one build/image is scoped to it, not generalized.
#   condition     the predicate, as data. `all` = every clause must hold.
#   evidence      tombstone/incident refs and dates. No ref, no rule.
#
# ADDING A RULE: only from a real incident. Do not anticipate.

version: 1
generated_from: "TOMBSTONES.md #27-#113, TROUBLESHOOTING.md #1-14, 2026-09-03 synthesis"

builds:
  # Named so a rule can be scoped to the build it was actually proven on.
  # KNOWN LIMITATION, confirmed real 2026-09-03 (see E015): this image's tag
  # is `:latest` and it floats. Every build string below is a point-in-time
  # pin, not a guarantee of what a recipe will run tomorrow. A rule scoped
  # to a build string goes silently DORMANT the moment :latest moves past
  # it -- it does not fire incorrectly, it just stops firing at all, which
  # is worse because nothing signals the gap. There is no fix for this
  # inside errata.yaml itself; the real fix is recording the image DIGEST
  # (not tag) as run metadata at deploy time (WORKSTREAMS.md WS-2/WS-9,
  # unbuilt). Until that lands, treat every build-scoped rule below as
  # needing a fresh spot-check whenever a deploy surfaces an unexpected
  # version string in its boot log -- do not assume silence means the rule
  # still applies.
  original_pin: "v0.1.dev20003+gad848fc41.d20260815"
    # The build every E001-E014 measurement in this file was originally
    # taken against (2026-08-15 through 2026-09-02 sessions).
  latest_confirmed:
    tag: "v0.1.dev20482+g83cb22a0e.d20260903"
    confirmed: "2026-09-03"
    checked_directly: >-
      vllm.envs has no attribute VLLM_USE_V1 (AttributeError); the entire
      vllm.executor package (V0 executor stack) is absent
      (ModuleNotFoundError). See E015.
    NOT_rechecked: >-
      Everything else in this file -- E001 through E014's specific error
      messages, env-var lists, and flag behaviors -- was NOT re-verified
      against this build. Their confidence: validated / known_bad ratings
      describe what was true on original_pin, not a claim that they still
      hold here. Most are vLLM core-mechanism errors (pydantic validation,
      NotImplementedError) unlikely to have changed wording across ~480 dev
      revisions, but E014 specifically (unrecognized VLLM_* env vars) is
      inherently build-string-sensitive -- exactly the class VLLM_USE_V1
      turned out to belong to -- and should be the first re-checked.

