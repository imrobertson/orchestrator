# =============================================================================
# ARCHITECTURE CONFIGURATION: AGNOSTIC ISOLATED SINGLE-HOST LOCAL DEPLOYMENT
# Mapped File Path Target: /home/tetrel/docker/docker-compose.standalone.yml
# =============================================================================
services:
  standalone-node:
    # Parameterizes the application image layer entirely, allowing a single file to deploy different apps.
    image: ${STANDALONE_IMAGE}
    # Normalizes the target container name to ensure simple, direct host tracking.
    container_name: ${STANDALONE_CONTAINER_NAME}
    # Mandates standard service persistence tracking loops.
    restart: unless-stopped
    
    # Bypasses internal container isolation bridges to surface endpoints directly onto the home LAN.
    network_mode: host
    ipc: host
    shm_size: 16gb
    
    environment:
      - PYTHONUNBUFFERED=1
      # Optional variable fallback assignment: defaults to 4 parallel tracks for Ollama schedulers.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4} 
      - HF_TOKEN=${HF_TOKEN}
      
      # -----------------------------------------------------------------
      # FORCE NVIDIA ENTRYPOINT DRIVER BYPASS & JUMP TO COMPATIBILITY
      # -----------------------------------------------------------------
      - NVIDIA_DISABLE_REQUIRE=true
      - VLLM_ENABLE_CUDA_COMPATIBILITY=1
      - LD_LIBRARY_PATH=/usr/local/cuda/compat:$LD_LIBRARY_PATH

    volumes:
      # Dynamically maps custom volume trees depending on your host's processing requirements.
      - ${STANDALONE_VOLUME_MOUNT}
      
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
              
    # Executing arguments feed cleanly out of environment tracking keys.
    command: ${STANDALONE_COMMAND}