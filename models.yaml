# ==============================================================================
# TETREL SECURITY - DGX CLUSTER MODEL INVENTORY
# ==============================================================================
# RUNTIME ASSUMPTIONS:
# - Hardware: Dual DGX Spark (Grace Blackwell GB10, LPDDR5x Unified Memory).
# - Software: vLLM 0.21.0+ (NVIDIA NGC Container 26.05.post1+).
# - Interconnect: 100GbE Backplane (enp1s0f0np0) via NCCL.
# ------------------------------------------------------------------------------
# DOCUMENTED ERRATA & TUNABLES (vLLM 0.21.0 / GB10):
# 1. UNIFIED MEMORY OOM: GB10 uses unified OS/GPU memory. `gpu_util` MUST NOT
#    exceed 0.70-0.75, or the Grace OS will be starved, causing container panics.
# 2. ASYNC SCHEDULING: vLLM 0.21.0+ requires asynchronous background scheduling
#    for performance. `--no-async-scheduling` must NEVER be used on this version.
# 3. GRACE CPU THREADING: Grace CPUs (72+ cores) suffer extreme context-switching
#    overhead in PyTorch if unbound. `OMP_NUM_THREADS=16` is strictly required
#    on ALL topologies (1-node and 2-node).
# 4. NEMOTRON NVFP4 BATCHING: Nemotron V3 NVFP4 variants on GB10 crash during
#    ingestion if sequences exceed 4. `--max-num-seqs 4` is strictly enforced.
# 5. MULTI-NUMA ALL-REDUCE: Custom all-reduce kernels hang on GB10 PCIe multi-node.
#    `--disable-custom-all-reduce` forces a stable NCCL fallback on 2-node setups.
# 6. CHUNKED PREFILL + SPECULATIVE: `--enable-chunked-prefill` is fatal when
#    combined with speculative decoding/MTP. Never mix these two flags.
# ==============================================================================

# ------------------------------------------------------------------------------
# GLOBAL BEHAVIOR FLAGS
# Set to 1 to force offline mode across all models. Set to 0 to parse per-stanza.
# ------------------------------------------------------------------------------
GLOBAL_HF_HUB_OFFLINE: 1
GLOBAL_TRANSFORMERS_OFFLINE: 1
default_image: "nvcr.io/nvidia/vllm:26.07-py3"


# ------------------------------------------------------------------------------
# 1. HOST INVENTORY & MULTI-INTERFACE NETWORK MATRIX
# ------------------------------------------------------------------------------
hosts:
  spark-9dbe:
    aliases:
      - "spark-4"
      - "4"
    ssh_user: "tetrel"
    compute_dir: "/opt/dgx-cluster-control"
    volume_mount: "/home/tetrel/.cache/huggingface:/root/.cache/huggingface"
    networks:
      management:
        wired: "10.0.14.43"
        wireless: "10.0.14.44"
      backplane: "192.168.99.2"

  spark-6e63:
    aliases:
      - "spark-3"
      - "3"
    ssh_user: "tetrel"
    compute_dir: "/opt/dgx-cluster-control"
    volume_mount: "/home/tetrel/.cache/huggingface:/root/.cache/huggingface"
    networks:
      management:
        wired: "10.0.14.41"
        wireless: "10.0.14.42"
      backplane: "192.168.99.1"

# ------------------------------------------------------------------------------
# 2. MODEL METADATA & TOPOLOGY TUNABLES
# ------------------------------------------------------------------------------
models:

  # ============================================================================
  # DEEPSEEK FAMILY
  # ============================================================================
  deepseek-v4-flash-nvfp4:
    hf_path: Rarri/DeepSeek-V4-Flash-0731-NVFP4
    gpu_util: 0.70
    topologies:
      2_node:
        max_model_len: 65536
        tp_size: 1
        pp_size: 2
        env_vars:
          - OMP_NUM_THREADS=16
          - VLLM_CPU_OMP_THREADS=16
          - TORCHINDUCTOR_AUTOGRAD_CACHE=0
          - TORCHINDUCTOR_FX_GRAPH_CACHE=0
          - DG_JIT_USE_NVRTC=0
          - NCCL_CUMEM_ENABLE=0
          - NCCL_IB_GID_INDEX=3
          - NCCL_SOCKET_IFNAME=enp1s0f0np0
          - GLOO_SOCKET_IFNAME=enp1s0f0np0
        vllm_args: >-
          --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8
          --distributed-executor-backend mp --enable-ep-weight-filter
          --attention-config '{"use_fp4_indexer_cache": true}'
          --moe-backend flashinfer_cutlass --compilation-config '{"mode": 0}'

  deepseek-r1-nvfp4:
