# ==============================================================================
# DGX SPARK CLUSTER: UNIFIED META-PROFILE & NETWORK CATALOG (V3.9.8 CLEANED)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HOST INVENTORY & MULTI-INTERFACE NETWORK MATRIX
# ------------------------------------------------------------------------------
hosts:
  spark-9dbe:
    aliases: ["spark-4", "4"]
    ssh_user: "tetrel"
    compute_dir: "/home/tetrel/docker"
    volume_mount: "/home/tetrel/.cache/huggingface:/root/.cache/huggingface"
    networks:
      management:
        wired: "10.0.14.43"
        wireless: "10.0.14.44"
      backplane: "192.168.99.2"

  spark-6e63:
    aliases: ["spark-3", "3"]
    ssh_user: "tetrel"
    compute_dir: "/home/tetrel/docker"
    volume_mount: "/home/tetrel/.cache/huggingface:/root/.cache/huggingface"
    networks:
      management:
        wired: "10.0.14.41"
        wireless: "10.0.14.42"
      backplane: "192.168.99.1"

# ------------------------------------------------------------------------------
# 2. MODEL METADATA & TOPOLOGY TUNABLES
# ------------------------------------------------------------------------------
models:
  # ----------------------------------------------------------------------------
  # DEEPSEEK ARCHITECTURES (0731 RELEASE - NVFP4 QUANTIZED)
  # ----------------------------------------------------------------------------
  deepseek-v4-flash-nvfp4:
    hf_path: "Rarri/DeepSeek-V4-Flash-0731-NVFP4"
    gpu_util: 0.90
    topologies:
      2_node:
        max_model_len: 65536
        tp_size: 1
        pp_size: 2
        env_vars:
          - "OMP_NUM_THREADS=16"
          - "VLLM_CPU_OMP_THREADS=16"
          - "TORCHINDUCTOR_AUTOGRAD_CACHE=0"
          - "TORCHINDUCTOR_FX_GRAPH_CACHE=0"
          - "DG_JIT_USE_NVRTC=0"
          - "NCCL_CUMEM_ENABLE=0"
          - "NCCL_IB_GID_INDEX=3"
          - "NCCL_SOCKET_IFNAME=enp1s0f0np0"
          - "GLOO_SOCKET_IFNAME=enp1s0f0np0"
        vllm_args: >-
          --disable-custom-all-reduce
          --trust-remote-code
          --kv-cache-dtype fp8
          --distributed-executor-backend mp
          --enable-ep-weight-filter
          --attention-config '{"use_fp4_indexer_cache": true}'
          --no-async-scheduling
          --num-gpu-blocks-override 8192

  # ----------------------------------------------------------------------------
  # NEMOTRON ARCHITECTURES (AGENTIC AUTOMATION CORE - AUG 11 DROP)
  # ----------------------------------------------------------------------------
  nemotron-3.5-lightning:
    hf_path: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
    gpu_util: 0.85
    topologies:
      1_node:
        max_model_len: 131072
        tp_size: 1
        pp_size: 1
        vllm_args: >-
          --trust-remote-code
          --kv-cache-dtype fp8
          --speculative-model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
          --speculative-config '{"method":"dspark"}'
          --no-async-scheduling
          --num-gpu-blocks-override 8192

  # ----------------------------------------------------------------------------
  # META MUSE ARCHITECTURES (MULTIMODAL AGENTIC CORE)
  # ----------------------------------------------------------------------------
  muse-glimmer-30b:
    hf_path: "meta-models/Muse-Glimmer-30B"
    gpu_util: 0.85
    topologies:
      1_node:
        max_model_len: 131072
        tp_size: 1
        pp_size: 1
        vllm_args: >-
          --trust-remote-code
          --kv-cache-dtype fp8
          --speculative-model meta-models/Muse-Glimmer-30B-DFlash
          --speculative-config '{"method":"dflash"}'
          --no-async-scheduling
          --num-gpu-blocks-override 8192

  # ----------------------------------------------------------------------------
  # QWEN ARCHITECTURES (27B NVFP4, 122B MoE)
  # ----------------------------------------------------------------------------
  qwen-3.6-27b-nvfp4:
    hf_path: "nvidia/Qwen3.6-27B-NVFP4"
    gpu_util: 0.85
    topologies:
      1_node:
        max_model_len: 262144
        tp_size: 1
        pp_size: 1
        vllm_args: >-
          --trust-remote-code
          --kv-cache-dtype fp8
          --language-model-only
          --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":2}'
          --no-async-scheduling
          --num-gpu-blocks-override 8192
      2_node:
        max_model_len: 262144
        tp_size: 1
        pp_size: 2
        env_vars:
          - "OMP_NUM_THREADS=16"
          - "VLLM_CPU_OMP_THREADS=16"
          - "TORCHINDUCTOR_AUTOGRAD_CACHE=0"
          - "TORCHINDUCTOR_FX_GRAPH_CACHE=0"
          - "NCCL_CUMEM_ENABLE=0"
          - "NCCL_IB_GID_INDEX=3"
          - "NCCL_SOCKET_IFNAME=enp1s0f0np0"
          - "GLOO_SOCKET_IFNAME=enp1s0f0np0"
        vllm_args: >-
          --disable-custom-all-reduce
          --trust-remote-code
          --kv-cache-dtype fp8
          --language-model-only
          --no-async-scheduling
          --num-gpu-blocks-override 8192

  qwen-3.8-27b:
    hf_path: "Qwen/Qwen3.8-27B"
    gpu_util: 0.85
    topologies:
      1_node:
        max_model_len: 262144
        tp_size: 1
        pp_size: 1
        vllm_args: >-
          --trust-remote-code
          --kv-cache-dtype fp8
          --language-model-only
          --no-async-scheduling
          --num-gpu-blocks-override 8192

  qwen-3.5-122b:
    hf_path: "Qwen/Qwen3.5-122B-A10B-FP8"
    dtype: "fp8"
    gpu_util: 0.85
    topologies:
      2_node:
        max_model_len: 32768
        tp_size: 1
        pp_size: 2
        env_vars:
          - "OMP_NUM_THREADS=16"
          - "VLLM_CPU_OMP_THREADS=16"
          - "TORCHINDUCTOR_AUTOGRAD_CACHE=0"
          - "TORCHINDUCTOR_FX_GRAPH_CACHE=0"
          - "NCCL_CUMEM_ENABLE=0"
          - "NCCL_IB_GID_INDEX=3"
          - "NCCL_SOCKET_IFNAME=enp1s0f0np0"
          - "GLOO_SOCKET_IFNAME=enp1s0f0np0"
        vllm_args: >-
          --disable-custom-all-reduce
          --trust-remote-code
          --max-num-seqs 16
          --enforce-eager
          --no-async-scheduling

  # ----------------------------------------------------------------------------
  # GEMMA ARCHITECTURES (RECONSTRUCTION TARGET - LAYOUT SANITIZER)
  # ----------------------------------------------------------------------------
  gemma-4-31b:
    hf_path: "google/gemma-4-31B-it"
