# ------------------------------------------------------------------------------
# 1. HOST INVENTORY & MULTI-INTERFACE NETWORK MATRIX
# ------------------------------------------------------------------------------
hosts:
  spark-9dbe:
    aliases: ["spark-4", "4"]
    ssh_user: "tetrel"
    compute_dir: "/opt/dgx-cluster-control"
    volume_mount: "/home/tetrel/.cache/huggingface:/root/.cache/huggingface"
    networks:
      management:
        wired: "10.0.14.43"
        wireless: "10.0.14.44"
      backplane: "192.168.99.2"

  spark-6e63:
    aliases: ["spark-3", "3"]
    ssh_user: "tetrel"
    compute_dir: "/opt/dgx-cluster-control"
    volume_mount: "/home/tetrel/.cache/huggingface:/root/.cache/huggingface"
    networks:
      management:
        wired: "10.0.14.41"
        wireless: "10.0.14.42"
      backplane: "192.168.99.1"
      
# ------------------------------------------------------------------------------
# 2. MODEL METADATA & TOPOLOGY TUNABLES
# ------------------------------------------------------------------------------
models:
  deepseek-v4-flash-nvfp4:
    hf_path: "Rarri/DeepSeek-V4-Flash-0731-NVFP4"
    gpu_util: 0.90
    topologies:
      2_node:
        max_model_len: 65536
        tp_size: 1
        pp_size: 2
        env_vars:
          - "OMP_NUM_THREADS=16"
          - "VLLM_CPU_OMP_THREADS=16"
          - "TORCHINDUCTOR_AUTOGRAD_CACHE=0"
          - "TORCHINDUCTOR_FX_GRAPH_CACHE=0"
          - "DG_JIT_USE_NVRTC=0"
          - "NCCL_CUMEM_ENABLE=0"
          - "NCCL_IB_GID_INDEX=3"
          - "NCCL_SOCKET_IFNAME=enp1s0f0np0"
          - "GLOO_SOCKET_IFNAME=enp1s0f0np0"
        vllm_args: >-
          --disable-custom-all-reduce
          --trust-remote-code
          --kv-cache-dtype fp8
          --distributed-executor-backend mp
          --enable-ep-weight-filter
          --attention-config '{"use_fp4_indexer_cache": true}'
          --no-async-scheduling
          --num-gpu-blocks-override 8192
          --moe-backend flashinfer_trtllm

  # ----------------------------------------------------------------------------
  # NEMOTRON ARCHITECTURES (AGENTIC AUTOMATION CORE)
  # ----------------------------------------------------------------------------
  nemotron-3.5-lightning:
    hf_path: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
    gpu_util: 0.85
    topologies:
      1_node:
        max_model_len: 131072
        tp_size: 1
        pp_size: 1
        vllm_args: >-
          --trust-remote-code
          --kv-cache-dtype fp8
          --speculative-model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
          --speculative-config '{"method":"dspark"}'
          --no-async-scheduling
          --num-gpu-blocks-override 8192

