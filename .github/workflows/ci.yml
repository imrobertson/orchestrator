name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run configuration regression tests
        run: python tests/test_config.py

      - name: Run recipe regression tests
        run: python tests/test_recipes.py

      - name: Run SSH regression tests
        run: python tests/test_ssh.py

      - name: Run deployment contract regression tests
        run: python tests/test_deployment.py

      - name: Check documentation references
        run: python tools/check_doc_references.py --repo .

      - name: Check documentation health
        run: python tools/doc_health.py --repo .

      - name: Check tracked-file inventory
        run: python tools/file_inventory.py
