recipe_version: '1'
# Qwen3.6-35B-A3B-NVFP4 with thinking DISABLED via chat_template_kwargs.
# Uses eugr/spark-vllm:latest (not -b12x) to avoid B12x plugin NVML crash.
# NO --moe-backend marlin: the unsloth compressed-tensors NVFP4 layout rejects it.
# vLLM auto-selects FLASHINFER_CUTLASS (NVFP4 MoE).
# Community-tested fix for reasoning loops, malformed tool calls, and
# code failures (0/5 vowel counter in default thinking mode).
hf_path: unsloth/Qwen3.6-35B-A3B-NVFP4
image: eugr/spark-vllm:latest
gpu_util: 0.75
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  1_node:
    max_model_len: 262144
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8 --language-model-only
      --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --compilation-config '{"mode": 0}'
      --max-num-seqs 4 --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":3}'
      --default-chat-template-kwargs '{"enable_thinking": false}'
