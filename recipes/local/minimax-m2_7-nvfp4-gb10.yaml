recipe_version: '1'
hf_path: saricles/MiniMax-M2.7-NVFP4-GB10
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.75
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  2_node:
    max_model_len: 196608
    tp_size: 2
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=8
    - VLLM_CPU_OMP_THREADS=16
    - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass
    - VLLM_USE_FLASHINFER_MOE_FP4=0
    - SAFETENSORS_FAST_GPU=1
    - TORCHINDUCTOR_MAX_AUTOTUNE=0
    - TORCHINDUCTOR_AUTOGRAD_CACHE=0
    - TORCHINDUCTOR_FX_GRAPH_CACHE=0
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_IB_DISABLE=0
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    vllm_args: >-
      --distributed-executor-backend ray --disable-custom-all-reduce --trust-remote-code
      --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --enable-chunked-prefill
      --enable-prefix-caching --max-num-seqs 8
