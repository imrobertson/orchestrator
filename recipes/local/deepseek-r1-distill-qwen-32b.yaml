recipe_version: '1'
hf_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.75
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  1_node:
    max_model_len: 32768
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8 --reasoning-parser deepseek_r1
  2_node:
    max_model_len: 131072
    tp_size: 2
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - TORCHINDUCTOR_AUTOGRAD_CACHE=0
    - TORCHINDUCTOR_FX_GRAPH_CACHE=0
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    - VLLM_ENGINE_INITIALIZATION_TIMEOUT=3600
    - VLLM_RPC_TIMEOUT=3600
    vllm_args: >-
      --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8 
      --reasoning-parser deepseek_r1 --enable-chunked-prefill 
      --distributed-executor-backend ray
