recipe_version: '1'
hf_path: deepseek-ai/DeepSeek-V4-Flash-0731
image: hazyumps/deepseek-v4-flash-gb10:sm121-cu130-20260727d
gpu_util: 0.80
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  2_node:
    # SOURCE: hazyumps/deepseek-v4-flash-gb10 README, confirmed live 2026-08-29.
    # This is a prebuilt image (linux/arm64, native GB10/sm_121) validated by
    # the repo author on real dual-GB10 hardware -- NOT a from-scratch smoke
    # test like deepseek-v4-flash-0731-dspark-sm120.yaml was. Reported numbers
    # on this exact config: ~47-60 tok/s decode (easy content), ~40 tok/s
    # (mixed real content), ~1.6-1.8k tok/s prefill.
    #
    # PREREQUISITE NOT EXPRESSED IN THIS YAML: README states MTU 9000 on the
    # RoCE link is mandatory for this image (NCCL 2.30.4 wedge fix depends on
    # it). This is a host/interface-level setting, not a container env var --
    # confirm `ip link show <iface>` reports mtu 9000 on both nodes before
    # launching, or set it: `sudo ip link set <iface> mtu 9000`.
    #
    # UNCONFIRMED, left out rather than guessed: --attention-backend and
    # --moe-backend. The README doesn't expose vllm serve flags directly --
    # they're inside start_head.sh/start_worker.sh, which we don't have the
    # contents of. Per the same reasoning as the sm120 smoke-test recipe,
    # different fork lineages carry their own kernel selection and stock
    # b12x-style flags may not apply or may not exist on this image. Leaving
    # unset lets vLLM auto-select; if boot logs show a bad backend choice,
    # that's the first thing to override.
    #
    # --block-size 256 carried over from the working stock recipe as a
    # starting assumption, NOT confirmed against this image -- flag if boot
    # fails around KV cache init.
    max_model_len: 393216
    tp_size: 2
    pp_size: 1
    env_vars:
    - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/lib/x86_64-linux-gnu
    - OMP_NUM_THREADS=16
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    - VLLM_ENGINE_INITIALIZATION_TIMEOUT=7200
    - VLLM_RPC_TIMEOUT=7200
    - GLOO_TIMEOUT=7200
    - TORCH_DISTRIBUTED_DEFAULT_TIMEOUT=7200
    - TORCH_GLOO_TIMEOUT_SECONDS=7200
    - NCCL_COMM_TIMEOUT=7200
    # Timeouts eased to the same proven-safe 7200s used for the sm120 smoke
    # test -- first launch of this image in our orchestrator, unfamiliar
    # cudagraph capture time included in cold boot (README quotes ~4-5 min
    # total cold boot, which is NOT --enforce-eager -- see below).
    #
    # PYTORCH_CUDA_ALLOC_CONF intentionally omitted here: the stock recipe
    # sets expandable_segments:True, but this image's own launch scripts may
    # already set CUDA allocator behavior internally. Add back if boot shows
    # fragmentation-related OOM.
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8
      --tokenizer-mode deepseek_v4 --distributed-executor-backend ray --tool-call-parser deepseek_v4
      --enable-auto-tool-choice --reasoning-parser deepseek_v4 --block-size 256
      --max-num-seqs 4 --enable-prefix-caching
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}'
    # --enforce-eager DROPPED, deliberately, unlike the sm120 smoke-test
    # recipe: this is a validated config (README's own numbers were measured
    # WITH cudagraph capture -- "FULL_AND_PIECEWISE cudagraph" is called out
    # as part of their tuned launch). Forcing eager mode here would mean
    # testing a different, unvalidated configuration and comparing against
    # numbers that don't apply to it. If boot fails specifically during
    # cudagraph capture, THAT's the moment to add --enforce-eager back in as
    # a diagnostic step, not before.
    #
    # --distributed-executor-backend ray carried over from our working stock
    # recipe (proven functional for this exact 2-node/1-GPU-per-node
    # topology in our environment, per the successful load in the earlier
    # session). NOT specifically confirmed against this image -- at least one
    # other third-party GB10 dual-Spark recipe (unrelated codebase) noted
    # needing a no-Ray/mp launch mode for single-GPU-per-node topologies, so
    # if this wedges specifically around worker rank assignment (not the
    # gloo-barrier-during-autotune pattern we already diagnosed), Ray
    # topology detection is the next thing to suspect.
    #
    # --max-num-seqs 4 matches the README's validated GA config (up from 2
    # after a 2026-06 fork rebase made it stall-free) rather than our usual
    # conservative --max-num-seqs 1 first-boot value -- intentional, per the
    # reasoning above: this is an adopt-their-validated-config launch, not a
    # from-scratch smoke test.
