recipe_version: '1'
# 2026-09-09: 2_node topology was dead on arrival and is now rebuilt.
# It carried THREE independent errata violations at once:
#   E005 - qwen3_next_mtp with pp_size 2. Hard NotImplementedError at
#          create_engine_config(); the MTP draft class does not implement
#          SupportsPP (TOMBSTONES #104). Fires first, before any weight load.
#   E003 - no --distributed-executor-backend ray, so it would have routed
#          onto the --headless path (#43).
#   E004 - no image: field at all, inheriting default_image
#          (nvcr.io/nvidia/vllm:26.07-py3), which does not ship ray (#103).
# Rebuilt as TP2 following the same remedy #107 applied to the
# qwen-3.5-122b siblings and #104 applied to qwen-3.6-27b-nvfp4.
#
# NOTE the image: field applies to BOTH topologies. 1_node previously ran on
# default_image and now runs on eugr/spark-vllm-b12x:latest -- a real change
# to a topology that was not broken. b12x is what every Qwen 3.8 sibling
# uses and it ships ray; if 1_node had a reason to stay on the NGC default,
# revert this line and drop the 2_node block instead.
#
# ############################################################
# BOTH TOPOLOGIES ARE UNTESTED. Do not treat either as validated.
# ############################################################
# 2_node has never run in any form -- the rebuild removes a known-dead
# config, it does not produce a known-good one. Its -nvfp4 sibling's TP2
# block is also unmeasured, so there is no validated 2-node Qwen 3.8
# configuration anywhere in the catalog to compare against.
# 1_node ran before but not like this: setting image: moved it off
# default_image onto b12x and reset its config_hash (image is
# recipe-level and build_config_payload() includes it), so its recorded
# launch history no longer applies either.
# Tracked in WORKSTREAMS.md WS-1 -- "qwen-3.8-27b::2_node rebuilt as TP2
# and never run". --dry-run both, deploy 1_node first, then 2_node, and
# record the results in MODELS.md, which shows both blank today.
hf_path: Qwen/Qwen3.8-27B
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.7
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  1_node:
    max_model_len: 262144
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8 --language-model-only --reasoning-parser qwen3
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":5}'
  2_node:
    max_model_len: 262144
    tp_size: 2
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - TORCHINDUCTOR_AUTOGRAD_CACHE=0
    - TORCHINDUCTOR_FX_GRAPH_CACHE=0
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    vllm_args: >-
      --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8 --language-model-only
      --distributed-executor-backend ray --reasoning-parser qwen3 --enable-auto-tool-choice
      --tool-call-parser qwen3_coder --speculative-config
      '{"method":"qwen3_next_mtp","num_speculative_tokens":5}'
