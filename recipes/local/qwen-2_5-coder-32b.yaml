recipe_version: '1'
hf_path: Qwen/Qwen2.5-Coder-32B-Instruct
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.7
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  1_node:
    max_model_len: 262144
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - NCCL_CUMEM_ENABLE=0
    - VLLM_USE_DEEP_GEMM=0
    vllm_args: >-
      --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8 --enable-chunked-prefill --max-num-seqs 2 --enable-prefix-caching
  2_node:
    max_model_len: 262144
    tp_size: 1
    pp_size: 2
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - TORCHINDUCTOR_AUTOGRAD_CACHE=0
    - TORCHINDUCTOR_FX_GRAPH_CACHE=0
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    - VLLM_USE_V1=0
    - VLLM_USE_DEEP_GEMM=0
    vllm_args: >-
      --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8 --enable-chunked-prefill --distributed-executor-backend ray --max-num-seqs 6 --enable-prefix-caching
