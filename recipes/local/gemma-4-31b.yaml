recipe_version: '1'
hf_path: google/gemma-4-31B-it
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.75
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  1_node:
    max_model_len: 32768
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_DISABLE_COMPILE_CACHE=1
    vllm_args: >-
      --trust-remote-code --quantization fp8 --kv-cache-dtype fp8
      --attention-backend TRITON_ATTN
      --max-num-batched-tokens 8192 --enable-chunked-prefill
  2_node:
    max_model_len: 131072
    tp_size: 2
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - TORCHINDUCTOR_AUTOGRAD_CACHE=0
    - TORCHINDUCTOR_FX_GRAPH_CACHE=0
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    - VLLM_DISABLE_COMPILE_CACHE=1
    vllm_args: >-
      --disable-custom-all-reduce --trust-remote-code --quantization fp8
      --kv-cache-dtype fp8 --attention-backend TRITON_ATTN
      --distributed-executor-backend ray --max-num-seqs 4
      --max-num-batched-tokens 8192 --enable-chunked-prefill
