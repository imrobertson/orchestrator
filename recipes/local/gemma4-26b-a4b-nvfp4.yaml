recipe_version: "1"

# NVIDIA's official ModelOpt NVFP4 checkpoint. Confirmed on real hardware
# (2026-08-31) to need NO mod -- unlike the community bg-digitalservices
# NVFP4 quant (mods/gemma4-nvfp4 was built for that one specifically; it
# does not apply here and must not be added to this recipe). See
# ME-REVIEW.md for the mod itself, kept for if the community checkpoint
# is ever wanted instead.
hf_path: nvidia/Gemma-4-26B-A4B-NVFP4

# Mainline vLLM build, NOT this cluster's usual eugr/spark-vllm-b12x:latest.
# The -b12x fork (lukealonso's custom SM120 MoE/dense kernels) has a real,
# reproducible bug in its Gemma4Proposer: TypeError: _greedy_sample() takes
# 2 positional arguments but 3 were given, crashing on the first real
# generate request (MTP's spec_step_idx argument, added when the base
# proposer class gained multi-step draft support, was never threaded
# through this fork's override). Confirmed via direct traceback capture,
# not inferred. MTP works cleanly on this image -- do not swap back to
# -b12x for this recipe without re-verifying that bug is actually fixed
# upstream in the fork first.
image: eugr/spark-vllm:latest

# This cluster's configured gpu_util_ceiling (cluster_config.yaml). Not
# pushed higher -- AEON-7's own production notes for this model family on
# this hardware (GB10's shared LPDDR5X pool) report page-thrashing above
# ~0.8 and instability even at 0.85. Untested above 0.75 for this specific
# recipe; if you do push it, watch for a hung host, not just a failed
# deploy.
gpu_util: 0.75

mods: []

notes: >
  MTP speculative decoding (google/gemma-4-26B-A4B-it-assistant drafter),
  num_speculative_tokens=2. Chosen over the shipped default of 4 after 8
  live-hardware runs on 2026-08-31, equal sample size on both sides: n=2
  (4 runs: 52.7 / 50.5 / 53.2 / 51.3 tok/s warm, mean 51.9, range 2.7) was
  consistently tighter than n=4 (4 runs: 49.1 / 50.2 / 54.8 / 47.8 tok/s
  warm, mean 50.5, range 7.0) -- roughly 2.6x n=4's run-to-run spread,
  holding steady as more n=2 runs were added rather than converging
  toward it. The mean gap (51.9 vs 50.5) is still smaller than n=4's own
  spread, so it isn't a clean throughput win on its own -- but n=2 also
  never triggers the "Enabling num_speculative_tokens > 1 will run
  multiple times of forward on same MTP layer, which may result in lower
  acceptance rate" warning vLLM logs for n=4 on every boot, which is a
  real structural reason to prefer it independent of the throughput
  numbers. Neither value cleanly cleared an informal 55 tok/s target
  across these runs; 54.8 (n=4's best single run) came closest.
  max_model_len is 32768, not this model's native 262144 -- that's what
  was actually tested with real benchmark numbers behind it, not a
  ceiling; raising it is untried. baseline (same checkpoint/image, no
  speculative decoding) measured 29.7 tok/s for comparison -- MTP is a
  genuine ~1.75x here, not a marginal win.

topologies:
  1_node:
    max_model_len: 32768
    tp_size: 1
    pp_size: 1
    env_vars: []
    vllm_args: >-
      --quantization modelopt --kv-cache-dtype fp8 --moe-backend marlin --trust-remote-code --speculative-config '{"method": "mtp", "model": "google/gemma-4-26B-A4B-it-assistant", "num_speculative_tokens": 2}'
