recipe_version: '1'
name: deepseek-v4-flash-0731-nvfp4
hf_path: auroter/DeepSeek-V4-Flash-0731-NVFP4
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.75
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  2_node:
    max_model_len: 393216
    tp_size: 2
    pp_size: 1
    env_vars:
    - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/lib/x86_64-linux-gnu
    - OMP_NUM_THREADS=16
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    vllm_args: >-
      --quantization modelopt_fp4 --attention-backend B12X_ATTN --moe-backend flashinfer_b12x 
      --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype nvfp4_ds_mla --enforce-eager 
      --tokenizer-mode deepseek_v4 --distributed-executor-backend ray --tool-call-parser deepseek_v4 
      --enable-auto-tool-choice --reasoning-parser deepseek_v4 --block-size 256 
      --max-num-seqs 2 --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","moe_backend":"b12x"}'
