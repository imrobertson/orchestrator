recipe_version: '1'
name: deepseek-v4-flash-0731-nvfp4
hf_path: auroter/DeepSeek-V4-Flash-0731-NVFP4
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.80
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  2_node:
    max_model_len: 262144
    tp_size: 2
    pp_size: 1
    # MULTI-NODE EXECUTOR REQUIREMENT: We MUST use Ray for multi-node deployments
    # and set VLLM_USE_V1=0 to force the legacy V0 engine for cross-host RPC.
    env_vars:
    - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/lib/x86_64-linux-gnu
    - OMP_NUM_THREADS=16
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    - VLLM_USE_V1=0
    # GB10 HARDWARE & MLA CACHE BYPASS:
    # - `flashinfer_cutlass` required for GB10 SwiGLU clamping.
    # - DO NOT add `--quantization modelopt_fp4` here to avoid container parser loops.
    # - `fp8` required for MLA KV cache.
vllm_args: >-
      --attention-backend FLASH_ATTN --moe-backend auto
      --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8 --enforce-eager
      --tokenizer-mode deepseek_v4 --distributed-executor-backend ray --tool-call-parser deepseek_v4
      --enable-auto-tool-choice --reasoning-parser deepseek_v4 --block-size 256
      --max-num-seqs 1 --enable-prefix-caching
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","moe_backend":"auto"}'
