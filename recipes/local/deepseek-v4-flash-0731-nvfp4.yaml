recipe_version: '1'
name: deepseek-v4-flash-0731-nvfp4
hf_path: auroter/DeepSeek-V4-Flash-0731-NVFP4
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.80
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  2_node:
    max_model_len: 262144
    tp_size: 2
    pp_size: 1
    env_vars:
    - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/lib/x86_64-linux-gnu
    - OMP_NUM_THREADS=16
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    - VLLM_ENGINE_INITIALIZATION_TIMEOUT=3600
    - VLLM_RPC_TIMEOUT=3600
    # No --speculative-config: this checkpoint's DSpark module has no serving
    # path on our stock vLLM/SM120 image (confirmed by the checkpoint author's
    # own model card). method:"mtp" is also wrong here regardless of image --
    # 0731 checkpoints ship DSpark, not an MTP head, so vLLM's mtp loader will
    # KeyError on the draft weights. Running without spec decode is the
    # documented, verified-working configuration for this checkpoint today.
    # Real DSpark support would need an out-of-tree SM120 vLLM build
    # (tracked upstream around vLLM PR #41834 and successors) -- worth a
    # separate project, not a recipe tweak.
    vllm_args: >-
      --attention-backend B12X_ATTN --moe-backend flashinfer_cutlass
      --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8 --enforce-eager
      --tokenizer-mode deepseek_v4 --distributed-executor-backend ray --tool-call-parser deepseek_v4
      --enable-auto-tool-choice --reasoning-parser deepseek_v4 --block-size 256
      --max-num-seqs 4 --max-num-batched-tokens 8192 --enable-prefix-caching
    # --enforce-eager left in for now to keep this a single-variable change
    # from the last known-loading config. Once you've confirmed a clean
    # baseline load + throughput number, dropping --enforce-eager is the
    # next thing worth testing on its own.
