recipe_version: '1'
# _TEST VARIANT: nemotron-3.5-lightning + tool-calling wired (agentic/brain use).
# The stock recipe has no --enable-auto-tool-choice/--tool-call-parser, so it 400s on
# any tools+tool_choice:auto request (verified 2026-09-05 sweep). qwen3_coder emits
# qwen3-style XML tool calls which vLLM parses regardless of base model family.
# dspark MTP n=5 kept from stock recipe (draft model ships with this checkpoint).
hf_path: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.70
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  1_node:
    max_model_len: 131072
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8 --max-num-seqs 4
      --compilation-config '{"mode": 0}' --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --speculative-model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
      --speculative-config '{"method":"dspark","num_speculative_tokens":5}'
