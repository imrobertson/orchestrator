recipe_version: '1'
# GLM-5.3-Flash NVFP4 (RedHatAI) on 2-node TP2
#
# 320B total / 18B active MoE, hybrid KDA-linear-attention + DeepSeek-sparse-MLA,
# 1M native context. Weight-only NVFP4 from RedHatAI (W4A4 compressed-tensors) —
# the current default checkpoint. LibertAIDAI/GLM-5.3-Flash-NVFP4 has ModelOpt
# token corruption (vLLM #54150); RedHatAI is uncorrupted and loads ~2x faster
# (11 large shards vs 120 small).
#
# VALIDATED ON HARDWARE, spark-3 (head) + spark-4 (worker).
#
# 262,144 VALIDATED 2026-09-09 -- the current configuration:
#   - 21.3, 23.2, 22.5 tok/s warm across three 3-pass runs. RANGE, not a
#     mean: the spread here is larger than the difference from 98304, so
#     quote the interval. TTFT 0.23-0.25 s.
#   - KV available 2.88 GiB on the worker (down from 3.94 at 98304), peak
#     activation up 2.82 -> 3.03 GiB. Margin is real but not large.
#   - boot ~11 min (weights ~6 min/rank, then JIT + cudagraph capture)
#
# 98,304 measured 2026-09-08, superseded:
#   - 22.3, 23.1 tok/s warm, TTFT 0.22 s
#   - KV pool 312,785 tokens, 3.18x concurrency, MTP acceptance 36.9% live
#
# THE TWO CONTEXT SETTINGS ARE INDISTINGUISHABLE at this sample size --
# 2.67x the context for no measurable throughput cost. 262144 is also
# upstream's own shipping TP2 configuration. See TOMBSTONES #143 for why
# this is stated as a range: the first 262144 run measured 21.3 and read as
# a clean ~8% penalty, which is what one expects and therefore what one
# stops questioning. Two further runs killed that reading.
#
# The MTP throughput figure REPRODUCES upstream's ~21.8 tok/s / ~0.24 s
# TTFT. Their KV-pool figure does not -- see the MAX CONTEXT NOTE.
#
# Community benchmarks (tonyd2wild), for comparison:
#   - fp8 KV + MTP-4: ~21.8 tok/s, 507K KV pool  <- tok/s reproduced, KV NOT
#   - fp8 KV + DFlash2: 46.9 tok/s, 74.1% acceptance, 581K KV (NOT TESTED here)
#   - 4-node TP4: 68.5 tok/s (sibling repo, not tested on 2-node)
#   - TTFT: ~0.24 s (greedy, no spec)
#
# Sources:
#   - Nvidia forum: tonyd2wild TP2 deploy with 7 day-0 bugs fixed:
#     github.com/tonyd2wild/GLM-5.3-Flash-NVFP4-DFlash2-2x-DGX-Spark
#   - RedHatAI official vLLM serving (MTP, glm47 parser):
#     huggingface.co/RedHatAI/GLM-5.3-Flash-NVFP4
#   - LibertAIDAI NVFP4 quant (corrupted — DO NOT USE):
#     huggingface.co/LibertAIDAI/GLM-5.3-Flash-NVFP4
#
# IMAGE: ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v8
#   Built on vllm/vllm-openai:glm53-flash-arm64-cu130 (base vLLM 0.1.dev20051)
#   with 5 patches that are required for GLM-5.3 on SM121:
#   1. SM90 NoPE sparse-MLA extended to SM121 (FlashInfer FA2 kernel)
#      — the stock SM120 backend requires pe_dim=64; GLM's NoPE has pe_dim=0
#   2. FlashInfer upgraded to 0.6.18 nightly (0.6.17 produces NaN on 64–256-row
#      batches on SM121, which covers normal prompt sizes)
#   3. NCCL pinned to 2.30.7 (nightly silently downgraded to 2.29.7, breaks IB)
#   4. nvidia-cutlass-dsl pinned to 4.6.2 (nightly left mixed 4.7.0/4.6.2,
#      CuTeDSL warmup ICE at ~91% model load)
#   5. PDL disabled on SM12x + top-k indexer hardening (uninitialized kpool
#      → NaN lottery, vLLM #51562 class issue)
#
# PATCH STATUS:
#   All 5 patches are baked into the sm121-v8 image. No overlay mounts needed.
#   The image is pullable from GHCR with zero auth.
#
# WEIGHTS: huggingface-cli download RedHatAI/GLM-5.3-Flash-NVFP4
#   --local-dir /var/tmp/glm-5.3-flash-nvfp4
#   Download to BOTH spark-3 and spark-4 (or NFS-export from head).
#   184.26 GiB on disk (11 safetensors files), 92.76 GiB resident per rank
#   after TP2 sharding. Measured boot 2026-09-08: ~11 min wall
#   (weights ~6 min on the head, ~5 min on the worker -- they differ, the
#   head is slower -- then ~75 s for JIT, profiling and cudagraph capture).
#
#   The mount is /var/tmp/glm-5.3-flash-nvfp4 on the HOST side. Docker
#   silently CREATES a missing bind-mount source as an empty directory
#   rather than failing, which reproduces the original FileNotFoundError
#   with no hint that the mount was the problem. Verify before deploying:
#     ls /var/tmp/glm-5.3-flash-nvfp4/processor_config.json    # on BOTH hosts
#
# MAX CONTEXT NOTE -- CORRECTED 2026-09-08, the original claim did not hold.
#
#   ORIGINAL CLAIM (upstream, left visible because the gap is unexplained):
#     "At fp8 KV + gmu 0.85, the KV pool is ~507K tokens (with MTP active)
#      to ~700K+ (without MTP) ... For 512K context, max ~1 concurrent
#      full-length request."
#
#   MEASURED HERE: 524288 does not boot at all. The engine refuses during
#   KV-cache allocation --
#
#     ValueError: To serve at least one request with the model's max seq
#     len (524288), 3.82 GiB KV cache is needed, which is larger than the
#     available KV cache memory (1.36 GiB). Based on the available memory,
#     the estimated maximum model length is 119808.
#
#   At 98304 it boots with a 312,785-token pool and 3.18x concurrency --
#   i.e. THREE concurrent full-length requests, not one. Better concurrency,
#   a fifth of the context.
#
#   WHERE THE MEMORY GOES (gpu_worker.py:790, both ranks, budget 103.44 GiB):
#     consumed (weights + non-torch)  95.55 GiB head / 96.68 GiB worker
#     peak activation                  2.79 / 2.82
#     KV in use                        5.09 / 3.94
#   Weights are 92.76 GiB, so ~3 GiB is non-torch overhead. The head/worker
#   KV asymmetry (5.09 vs 3.94) is REAL AND UNEXPLAINED -- under TP2 these
#   should match, and the cluster is limited by the smaller.
#
#   RULED OUT: the multimodal encoder cache. It reports an identical 32242
#   token budget at both 524288 and 98304, so it does not scale with
#   context and is not the missing memory.
#
#   RESOLVED 2026-09-09 -- and the recommendation this note used to carry
#   was WRONG in a way worth leaving visible.
#
#   The context problem was never memory. It was that nobody tried the
#   middle: 524288 refuses to boot, 98304 was chosen to get the recipe
#   serving, and 262144 -- upstream's own shipping TP2 value -- boots and
#   costs nothing measurable. Two sessions of memory accounting went into a
#   question that a different max_model_len answered.
#
#   THE RETRACTED RECOMMENDATION: this note previously said vLLM's own
#   `--kv-cache-memory=9166886912` suggestion ("to fully utilize gpu
#   memory") was "the most promising lead" and should be tried. DO NOT.
#   Upstream documents that concurrency is bounded by free-memory HEADROOM
#   rather than by the pool: at `--kv-cache-memory 4445787956` -- LESS than
#   the value suggested here -- a 3-way 20K-token prefill drove
#   MemAvailable to 3.06 GB and their anti-OOM watchdog killed the engine.
#   Their shipping pin (3221225472, a 310,292-token pool) is deliberately
#   LOWER than what fits, for headroom under load. The heuristic here
#   arrives at 2.88 GiB unpinned, close enough that pinning has not been
#   necessary.
#
#   Still unexplained, and left recorded rather than tidied away: the
#   head/worker KV asymmetry above (5.09 vs 3.94 GiB at 98304). Under TP2
#   these should match and the cluster is limited by the smaller.
#
#   The real performance lever is DFlash2, not memory: 46.9 tok/s vs 21.8
#   for MTP-4 at this exact context upstream (2.15x) at 74.1% acceptance,
#   and it costs ZERO KV pool -- its layers slot-share the MLA tensors the
#   way GLM's own mamba layers do, so context is unaffected. Needs a
#   different image (this build ships DFlash1 and predates DFlash2,
#   upstream PR #52816) plus the 2.2 GB incoai/GLM-5.3-Flash-DFlash2
#   drafter staged on both hosts. Tracked in WORKSTREAMS.
#
# DEPLOY SEQUENCE:
#   Upstream's procedure is worker-first with a ~25 s gap, then the head.
#   The orchestrator launches HEAD FIRST with no delay, and that worked --
#   validated 2026-09-08. NCCL rendezvous completed in ~2.5 s on both comms
#   over RoCE. Do not add a delay to the deploy path on upstream's word
#   alone; if a rendezvous hang ever appears, this ordering is the first
#   thing to suspect, but it is not a problem today.
#
#   Full teardown of both hosts before either relaunch still applies, and
#   `dgx-config teardown --all --force` is the way (spark-3 is reserved).
#   Capture docker logs before tearing down -- a failed boot leaves the head
#   spinning in shm_broadcast with IB retry errors and the log is the only
#   record of why.
#
# KNOWN GB10/SM121 issues (all resolved by the image):
#   - decode-time top-k hard-kills past ~24K (Patch 1: FA2 kernel)
#   - FlashInfer 0.6.17 NaN on 64–256-row batches (Patch 2: 0.6.18 nightly)
#   - NCCL 2.29.x IB failure (Patch 3: pinned 2.30.7)
#   - CuTeDSL ICE at 91% load (Patch 4: cutlass-dsl 4.6.2)
#   - PDL race + uninitialized kpool (Patch 5: PDL disabled, indexer hardened)
hf_path: RedHatAI/GLM-5.3-Flash-NVFP4
image: ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v8
# Neutralizes this image's own ENTRYPOINT. Required, not cosmetic.
#
# The image is built on vllm/vllm-openai, which sets
# ENTRYPOINT ["vllm","serve"]. Docker APPENDS a container CMD to an
# ENTRYPOINT rather than replacing it, so the orchestrator's 2-node
# ray container -- CMD ["ray","start","--head","--port=6379",
# "--num-gpus=1","--block"] -- actually launched as
# `vllm serve ray start ... --block`. vLLM's argparse prefix-matched
# --block to --block-size (an unambiguous prefix) and died with
# "argument --block-size: expected one argument". That reads like a
# fault in the --block-size 2304 line below and is nothing to do with
# it -- that flag never got parsed at all.
#
# "" is meaningful and DISTINCT from omitting this field. Omitted
# means "pass no --entrypoint flag", which is correct for
# eugr/spark-vllm* and the nvcr default image (neither sets an
# ENTRYPOINT). Quotes are required: bare `entrypoint:` parses as null.
entrypoint: ""
# Launch via the `vllm serve` CLI, NOT the api_server module path.
#
# Required for the 2-node worker, confirmed by reading this image's own
# vllm/entrypoints/cli/serve.py: line 146 `run_headless(args)`, line 177
# `def run_headless(...)`, and line 262 `assert not args.headless`. The
# CLI branches on --headless into run_headless(), which starts workers
# only. The path api_server.py runs is the one guarded by that assert --
# reachable only with headless FALSE.
#
# Launched via the module path, the worker PARSED --headless (it appears
# in the boot log's "non-default args") and then IGNORED it: it started
# its own APIServer and EngineCore, which called collective_rpc on a node
# that correctly knew it was a follower, and died with
# "AssertionError: collective_rpc should not be called on follower node"
# after ~9 minutes of weight loading. The head then hung indefinitely on
# shm_broadcast with IB retry-exhausted errors against the dead peer.
#
# {model} is substituted with model_path_override below and suppresses the
# separate --model flag -- `vllm serve`'s usage line is
# `vllm serve [model_tag] [options]`, so the model is positional.
launch_argv_prefix: ["vllm", "serve", "{model}"]
# Glm5NextProcessor.from_pretrained() (this image's custom GLM5-Next
# processor code) does a bare `open(os.path.join(model_path,
# "processor_config.json"))` -- no hub resolution, no cached_file(), just a
# local directory read. hf_path above is a repo id string, exactly what
# every other recipe passes to --model; this processor cannot resolve one
# no matter what's cached, so a plain deploy fails with FileNotFoundError
# on 'RedHatAI/GLM-5.3-Flash-NVFP4/processor_config.json' before the engine
# ever loads a weight.
#
# model_path_override + extra_mounts together fix this: stage the weights
# as a real directory on every target host (both spark-3 and spark-4, per
# this recipe's own WEIGHTS section above and tonyd2wild's launcher), bind
# it into the container at the path below, and point --model at that
# container path instead of the repo id. hf_path above is UNCHANGED and
# still what the ledger/dashboard/HF-cache bookkeeping treats as this
# recipe's identity -- only the literal --model argv changes.
#
# REQUIRED MANUAL STEP before this recipe can deploy, on BOTH spark-3 and
# spark-4 (the orchestrator does not do this automatically -- there is no
# mods/prefetch hook for a path outside the shared HF cache mount):
#   huggingface-cli download RedHatAI/GLM-5.3-Flash-NVFP4 \
#     --local-dir /var/tmp/glm-5.3-flash-nvfp4
# NOTE the container path's basename is GLM-5.3-Flash-NVFP4, matching
# hf_path's basename exactly INCLUDING CASE -- not the lowercase
# /var/tmp/... host path. _discover_host_container() reads the last path
# segment of --model and _resolve_catalog_key() matches it case-sensitively
# against hf_path, so a lowercase container path resolves to no catalog
# entry and the ledger/session tracker key on a fabricated name. The host
# side can be named anything; only the container side matters.
model_path_override: /models/GLM-5.3-Flash-NVFP4
extra_mounts:
- /var/tmp/glm-5.3-flash-nvfp4:/models/GLM-5.3-Flash-NVFP4
gpu_util: 0.85
gpu_util_ceiling_exempt: true
notes: |
  LibertAIDAI/GLM-5.3-Flash-NVFP4 has ModelOpt token corruption (vLLM #54150) — use RedHatAI/GLM-5.3-Flash-NVFP4 instead.
  262,144 context validated 2026-09-09: 21.3–23.2 tok/s warm across three 3-pass runs, TTFT ~0.24 s, MTP acceptance ~37%. Indistinguishable from 98304, so the larger context is free.
  The upstream ~507K KV-pool claim does NOT hold here — 524288 refuses to boot. See the recipe's MAX CONTEXT NOTE and docs/REFERENCE-decode-speeds.md.
  Not applicable: Tombstone #38 (Marlin MXFP4 KeyError) only affects mixed-precision activations; this is weight-only NVFP4.
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  2_node:
    # Tensor-parallel 2 across two GB10 (128 GB unified each, CX-7 twin 200GbE).
    #
    # KV cache: fp8 (~5.95 bytes/token vs 11.9 for bf16). At gmu 0.85, ~7.2 GB
    # available for KV → ~507K tokens with MTP active, ~700K+ without MTP.
    #
    # --block-size 2304: passed, and then OVERRIDDEN by the engine. Confirmed
    #   2026-09-08 in both ranks' boot logs:
    #     "Setting attention block size to 4608 tokens to ensure that
    #      attention page size is >= mamba page size."
    #     "Padding mamba page size by 2.86% to ensure that mamba page size
    #      and attention page size are exactly equal."
    #   So the value that takes effect is 4608, not 2304, and the original
    #   rationale below does not survive contact with this build. The flag is
    #   KEPT rather than removed because removing it is a separate untested
    #   change and the engine's override appears deterministic -- but do not
    #   reason about 2304 as if it were in force.
    #
    #   Original rationale (community-verified, tonyd2wild): "The block
    #   aligner picks 2176 on this backend; DeepGEMM paged-MQA on arch-12 fp8
    #   accepts only 64-entry pool pages. 2304 is a multiple of both 256
    #   (kpool·64) and 128 (MLA alignment), and the aligner pads the mamba
    #   page ~6% to match." 
    #
    # --moe-backend marlin: Verified on sm_121 by tonyd2wild. FLASHINFER_CUTLASS
    #   also runs but marlin was kept for the validated final config.
    #
    # --speculative-config with MTP-5: GLM-5.3's native MTP draft head.
    #   Zero extra VRAM beyond the main model. num_spec=5 matches RedHatAI's
    #   official config; tonyd2wild measured mean acceptance 37–47%.
    #
    # --tool-call-parser glm47: GLM-5.x uses a different tool format than
    #   GLM-4.x. Using `glm` silently swallows the tool call output (returns
    #   finish_reason=stop with tool_calls=null). glm47 correctly parses the
    #   GLM-4.5+ format.
    #
    # --reasoning-parser glm45: extracts chain-of-thought into the reasoning
    #   field. Disable per-request with chat_template_kwargs: {"enable_thinking": false}.
    #
    # --enable-prefix-caching: RedHatAI recommends this for GLM-5.3.
    # 262144. Not the 524288 this recipe originally carried (does not boot),
    # and not the 98304 it passed through while being brought up. See the
    # MAX CONTEXT NOTE in the header for the engine's refusal at 524288 and
    # the three-run comparison showing 262144 costs nothing measurable.
    #
    # Do not raise this again without re-benchmarking. The margin at 262144
    # is real but not large: KV available fell 3.94 -> 2.88 GiB on the
    # worker and peak activation rose 2.82 -> 3.03 GiB. And do NOT reach
    # for --kv-cache-memory to buy more -- see the retraction in that same
    # note.
    max_model_len: 262144
    tp_size: 2
    pp_size: 1
    env_vars:
    - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/lib/x86_64-linux-gnu
    - OMP_NUM_THREADS=16
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    - VLLM_ENGINE_INITIALIZATION_TIMEOUT=7200
    - VLLM_RPC_TIMEOUT=7200
    - GLOO_TIMEOUT=7200
    - TORCH_DISTRIBUTED_DEFAULT_TIMEOUT=7200
    - TORCH_GLOO_TIMEOUT_SECONDS=7200
    - NCCL_COMM_TIMEOUT=7200
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8
      --tool-call-parser glm47
      --enable-auto-tool-choice --reasoning-parser glm45 --block-size 2304
      --moe-backend marlin
      --max-num-seqs 2
      --speculative-config '{"method":"mtp","num_speculative_tokens":5}'
