recipe_version: '1'
hf_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.7
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
topologies:
  1_node:
    max_model_len: 131072
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - TORCHINDUCTOR_AUTOGRAD_CACHE=0
    - TORCHINDUCTOR_FX_GRAPH_CACHE=0
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8 --enable-chunked-prefill --enable-prefix-caching
      --max-num-seqs 8
