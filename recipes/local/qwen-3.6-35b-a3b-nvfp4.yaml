recipe_version: '1'
# Qwen3.6-35B-A3B is a 35B-total / 3B-active MoE. NVFP4 MoE variant -- the
# community-nominated single-DGX-Spark sweet spot (Appreciable A3B active footprint).
# 1_node (tp=1) ONLY per the no-PP=2/2-node rule -- this intentionally has no
# 2_node topology: A3B NVFP4 fits one GB10 and must not be racked across both
# (dead-end multi-node path, see REFERENCE-flashinfer-autotune-internals.md).
#
# ============================================================================
# VALIDATED ON HARDWARE 2026-09-05 (empirical, spark-3 GB10, eugr/spark-vllm-b12x)
# ============================================================================
#   Decode speed:  68.6 t/s sustained (512-token decode, TTFT 0.11s) --
#                  fastest single-Spark brain measured on this cluster.
#   A/B tuning:    base config (MTP n=3, moe auto-select) is the sweet spot.
#                  A/B'd and REJECTED (kept as _-prefixed test recipes):
#                    - VLLM_FLASHINFER_MOE_BACKEND=latency -> 62.8 t/s (worse)
#                    - MTP num_speculative_tokens=6       -> 55.9 t/s (worse,
#                                                              + overthinking)
#   Tool-calling:  verified correct multi-turn (list_dir -> read_file -> answer).
#   Coding:        5/5 (count_vowels suite) with fair output budget.
#   Agentic eval:  see tests/agentic_eval.py (promoted from /tmp harness).
#
# CHANGE FROM PRIOR COMMIT (this file was previously committed broken):
#   The prior recipe passed `--moe-backend marlin`. That flag is NVFP4-ONLY and
#   this unsloth checkpoint is a MIXED FP8/NVFP4 compressed-tensors quant
#   (group_0 FP8: attention/linear_attn/lm_head + MoE experts layers 32-39;
#   group_1 NVFP4: MoE gate/up/down all layers). vLLM's backend resolver
#   rejects it:
#     ValueError: moe_backend='marlin' is not supported for unquantized MoE.
#   Fix (this commit): REMOVE the flag. vLLM then auto-selects
#   FLASHINFER_CUTLASS (NVFP4 MoE) + TRITON (FP8 MoE) -- confirmed in the
#   engine boot log, model loads cleanly, 68.6 t/s measured.
#   This was the root cause of both 2026-09-05 load failures.
# ============================================================================
hf_path: unsloth/Qwen3.6-35B-A3B-NVFP4
image: eugr/spark-vllm-b12x:latest
gpu_util: 0.75
capability:
  task: null
  context_class: null
  latency_class: null
mods: []
notes: >-
  VALIDATED 2026-09-05: 68.6 t/s, TTFT 0.11s, tool-calling verified, coding
  5/5. Base MTP n=3 config is optimal (A/B'd latency-moe and MTP n=6, both
  slower). No --moe-backend (mixed FP8/NVFP4 checkpoint; marlin rejects it).
topologies:
  1_node:
    # 35B-A3B NVFP4 fits one GB10 with room (A3B active). MTP spec-decode with
    # a 3-token draft; 83-93% acceptance community-reported, 88.6% measured
    # live on this hardware (264 draft / 234 accepted).
    max_model_len: 262144
    tp_size: 1
    pp_size: 1
    env_vars:
    - OMP_NUM_THREADS=16
    - VLLM_CPU_OMP_THREADS=16
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    vllm_args: >-
      --trust-remote-code --kv-cache-dtype fp8 --language-model-only
      --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --compilation-config '{"mode": 0}'
      --max-num-seqs 8 --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":3}'
