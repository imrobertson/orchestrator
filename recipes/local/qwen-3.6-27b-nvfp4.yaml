    - TORCHINDUCTOR_FX_GRAPH_CACHE=0
    - NCCL_CUMEM_ENABLE=0
    - NCCL_IB_GID_INDEX=3
    - NCCL_SOCKET_IFNAME=enp1s0f0np0
    - GLOO_SOCKET_IFNAME=enp1s0f0np0
    vllm_args: >-
      --distributed-executor-backend ray --disable-custom-all-reduce --trust-remote-code --kv-cache-dtype fp8 --language-model-only
      --compilation-config '{"mode": 0}' --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":3}'
