ssh_user: tetrel
ssh_key_name: id_dgx_orchestrator
default_image: nvcr.io/nvidia/vllm:26.07-py3
gpu_util_ceiling: 0.75

# Which host an unqualified 1-node operation lands on.
#
# Every "default host" used to resolve to the first entry under `hosts:`
# below (dgx-orchestrator.py's PRIMARY_HOST). That one variable was doing
# two unrelated jobs: naming the structural head node for 2-node Ray
# deploys and the telemetry-authoritative serving host, AND acting as the
# fallback target for anything that didn't name a host explicitly. Those
# pull in opposite directions as soon as one node holds something
# long-lived -- the node you most want to stay authoritative is then also
# the node a bare `deploy` would flatten.
#
# Setting this splits the two apart. It governs 1-node defaults only: a
# 2-node deploy still puts the head on the first listed host, so the head
# node stays consistent across topologies. Affects `deploy` with no
# --head, tests/metest.py and ab_test.py with no --host, and the
# interactive menu's default selection.
#
# Omit it entirely and everything falls back to the first active host,
# i.e. the behaviour before this field existed.
default_deploy_target: spark-4

# Cluster-wide offline-mode switches. Set to 1 to force offline mode across
# all models; toggled at runtime by /api/toggle-network. Moved here from
# models.yaml's GLOBAL_HF_HUB_OFFLINE / GLOBAL_TRANSFORMERS_OFFLINE as part
# of the Phase 2 recipes migration -- see common/recipes.py.
global_hf_hub_offline: 0
global_transformers_offline: 0

ports:
  vllm_api: 8000
  orchestrator_api: 5001
  ray: 6379
  master: 29500

container_names:
  standalone: vllm-standalone
  head: vllm-head
  worker: vllm-worker

# Deploy-time tuning knobs previously hardcoded as literals inside
# dgx-orchestrator.py's _execute_deployment_impl(). Centralized here so
# they can be adjusted without a code change/redeploy of the orchestrator
# itself, same rationale as `ports:` above. See common/config.py's
# TuningConfig for defaults used if this section is omitted entirely
# (keeps older cluster_config.yaml files working unmodified).
tuning:
  # --shm-size passed to `docker run` for 1-node (standalone) vs 2-node
  # (head/worker) deploys. Previously hardcoded 16gb / 64gb respectively.
  shm_size_1node: 16gb
  shm_size_2node: 64gb

  # Value passed to `nvidia-smi -lgc <min>,<max>` before every deploy, to
  # pin GPU clocks for consistent benchmarking. Previously hardcoded
  # "300,1800".
  gpu_clock_lock: "300,1800"

  # wait_for_cluster_ready()'s budget/cadence when a deploy is called with
  # --wait or --benchmark. Previously hardcoded timeout_sec=900,
  # poll_interval=15 at the call site in _execute_deployment_impl.
  deploy_wait_timeout_sec: 900
  deploy_poll_interval_sec: 15

  # CUDA_CACHE_MAXSIZE (bytes) for the Triton/CUDA JIT-compile cache mounted
  # into every deployed container -- see _jit_cache_mounts_and_env().
  jit_cache_maxsize_bytes: 10737418240  # 10GB

  # When true, sets CUDA_LAUNCH_BLOCKING=1 in every deployed container,
  # forcing synchronous kernel launches so a kernel-level fault raises a
  # normal traceback at its actual call site instead of surfacing later as
  # an opaque "RayWorkerProc died unexpectedly" with no stack. Costs real
  # decode throughput -- only flip on while actively chasing a repro of a
  # silent crash, then flip back off.
  debug_launch_blocking: false

  # Retention (days) for the per-deploy Ray/crash log dirs under
  # ~/.cache/ray-logs/<deploy_run_id>/<host>, consumed by
  # `dgx-config prune-ray-logs`. These are tiny relative to JIT/HF caches,
  # so cleanup is time-based rather than tied to a free-space floor.
  crash_log_retention_days: 7

hosts:
  # Listed first, so this is PRIMARY_HOST: the head node of every 2-node
  # Ray deploy and the host whose /metrics feed SESSION_TRACKER. Order
  # here is load-bearing -- do not reorder without reading
  # dgx-orchestrator.py's comment above PRIMARY_HOST.
  spark-3:
    alias: spark-6e63
    role: head
    management_ip: 10.0.14.41
    backplane_ip: 192.168.99.1
    volume_mount: /home/tetrel/.cache/huggingface:/root/.cache/huggingface
    active: true
    # Carries the resident hermes agent. Deploy and teardown both refuse
    # to touch this host without --force, including whole-cluster
    # teardowns (`--all`, and the dashboard's Teardown button, which posts
    # no host list and therefore means "everything").
    #
    # A property of the NODE, not of any deployment: unlike `role` above,
    # which describes this host's part in one particular topology, being
    # reserved is a statement about what the machine is for. It stays
    # meaningful under an N-node generalization where any node can be head
    # or worker.
    #
    # Note this does NOT protect against a 2-node deploy being blocked
    # rather than silently proceeding -- 2-node always spans both hosts,
    # so any 2-node work needs --force and will take hermes down. That is
    # intended: it should be a decision, not a surprise.
    reserved: true
  spark-4:
    alias: spark-9dbe
    role: worker
    management_ip: 10.0.14.43
    backplane_ip: 192.168.99.2
    volume_mount: /home/tetrel/.cache/huggingface:/root/.cache/huggingface
    active: true

network:
  topology: switched
  interface: enp1s0f0np0
  nccl_ib_hca: rocep1s0f0
